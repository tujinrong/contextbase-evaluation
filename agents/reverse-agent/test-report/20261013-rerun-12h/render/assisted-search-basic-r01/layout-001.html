<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>学生管理</title>
<style>
:root{font-family:Meiryo,"Yu Gothic UI",sans-serif;color:#243448;background:#f2f5f9;font-size:14px}*{box-sizing:border-box}body{margin:0}header{background:#153654;color:white;padding:16px 28px;display:flex;justify-content:space-between;gap:20px}main{background:white;max-width:1440px;margin:24px auto;padding:24px}h1{font-size:24px}fieldset{border:1px solid #c8d1dc;padding:18px;margin:12px 0}legend{font-weight:bold}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px 28px}label{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}input,select,textarea,button{font:inherit;padding:8px;border:1px solid #afbece;border-radius:3px}input,select,textarea{max-width:100%;width:100%}.check{display:inline-flex;flex-direction:row;align-items:center;margin-right:12px}.check input{width:auto}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}button{background:white;cursor:pointer}.primary{background:#1c5985;color:white}.danger{color:#ae2534;border-color:#b44d59}button:disabled{cursor:default;color:#8a98a5;background:#f3f5f8}.message{padding:14px;border:1px solid #b6dccc;background:#edf7f3}.error{background:#fff1f1;border-color:#c66}.warning{background:#fff8eb;padding:12px}.grid{overflow-x:auto}table{border-collapse:collapse;min-width:1050px;width:100%;font-size:12px}th,td{padding:10px 8px;border:1px solid #d4dee8;vertical-align:top;overflow-wrap:anywhere}th{background:#e6eef6}tr:nth-child(even){background:#f8fafc}.pager{display:flex;gap:14px;align-items:center;justify-content:center;margin:18px}small{color:#5f7183}@media(max-width:760px){main{margin:0;padding:15px}.fields{grid-template-columns:1fr}header{flex-direction:column}}
</style>
</head>
<body>
<header><strong>学生管理システム</strong><span>利用者［利用者名］　業務日［yyyy/MM/dd］</span></header>
<main>
<h1>学生検索</h1>
<form data-method="post" data-route="/students/search" data-search-form="">
<input name="ContextId" type="hidden" value=""/>
<input name="ContextRevision" type="hidden" value=""/>
<input name="TabId" type="hidden" value=""/>
<input name="PageSize" type="hidden" value="20"/>
<input name="SortKey" type="hidden" value="studentNo"/>
<input name="SortDirection" type="hidden" value="asc"/>
<input name="__RequestVerificationToken" type="hidden" value=""/>
<fieldset><legend>検索条件</legend><div class="fields">
<label>学籍番号<input id="SRC-001" maxlength="30" name="Criteria.StudentNo" value=""/></label>
<label>氏名<input id="SRC-002" maxlength="16" name="Criteria.Name" value=""/></label>
<label>氏名カナ<input id="SRC-003" maxlength="72" name="Criteria.Kana" value=""/></label>
<label>年度<select id="SRC-004" name="Criteria.SchoolYear"><option value="">すべて</option></select></label>
<label>学年<select id="SRC-005" name="Criteria.GradeCode"><option value="">すべて</option></select></label>
<label>クラス<select id="SRC-006" name="Criteria.ClassId"><option value="">すべて</option></select></label>
<label class="check"><input id="SRC-007" name="Criteria.UnassignedOnly" type="checkbox" value="true"/>未所属のみ</label>
<fieldset><legend>在籍区分</legend><label class="check"><input checked="" name="Criteria.StatusCodes" type="checkbox" value="01"/>在学</label><label class="check"><input checked="" name="Criteria.StatusCodes" type="checkbox" value="02"/>休学</label><label class="check"><input name="Criteria.StatusCodes" type="checkbox" value="03"/>卒業</label><label class="check"><input name="Criteria.StatusCodes" type="checkbox" value="04"/>退学</label><small>全解除はすべて</small></fieldset>
<label>都道府県<select id="SRC-009" name="Criteria.PrefectureCode"><option value="">すべて</option></select></label>
<label>電話番号<input id="SRC-010" maxlength="40" name="Criteria.PhoneNumber" value=""/></label>
<label>入学日・開始<input id="SRC-011" name="Criteria.AdmissionFrom" type="date" value=""/></label>
<label>入学日・終了<input id="SRC-012" name="Criteria.AdmissionTo" type="date" value=""/></label>
</div><div class="actions"><button class="primary" data-method="post" data-route="/students/search" type="button">検索</button><button data-method="post" data-route="/students/options" type="button">候補を更新</button></div></fieldset>
</form>
<div class="actions"><form data-method="post" data-route="/students/clear"><input name="__RequestVerificationToken" type="hidden" value=""/><input name="ContextId" type="hidden" value=""/><input name="ContextRevision" type="hidden" value=""/><input name="TabId" type="hidden" value=""/><button type="button">クリア</button></form><a data-route="/students/new?returnContextId={ContextId}" href="#registration-transition">新規登録</a></div>
<p>未検索</p>
<form data-method="post" data-route="/students/page">
<input name="__RequestVerificationToken" type="hidden" value=""/><input name="ContextId" type="hidden" value=""/><input name="ContextRevision" type="hidden" value=""/><input name="TabId" type="hidden" value=""/>
<div class="actions"><label>表示件数<select name="PageSize"><option selected="" value="20">20</option><option value="50">50</option><option value="100">100</option></select></label><label>並び順<select name="SortKey"><option selected="" value="studentNo">学籍番号</option><option value="name">氏名</option><option value="admissionDate">入学日</option><option value="updatedAt">更新日時</option></select></label><select aria-label="並び順方向" name="SortDirection"><option selected="" value="asc">昇順</option><option value="desc">降順</option></select><button disabled="" name="Page" type="button" value="1">並び順・件数を反映</button></div>
<div class="grid"><table><thead><tr><th>学籍番号</th><th>氏名</th><th>氏名カナ</th><th>生年月日</th><th>年度／学年</th><th>クラス</th><th>在籍区分</th><th>住所</th><th>本人電話</th><th>更新日時</th><th>操作</th></tr></thead><tbody></tbody></table></div>
<nav class="pager"><button disabled="" name="Page" type="button" value="0">前へ</button><span>1 / 1</span><button disabled="" name="Page" type="button" value="2">次へ</button></nav>
</form>
</main>
</body>
</html>
</body></html>
