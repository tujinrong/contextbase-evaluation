<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>学生管理</title>
<style>
:root{font-family:Meiryo,"Yu Gothic UI",sans-serif;color:#243448;background:#f2f5f9;font-size:14px}*{box-sizing:border-box}body{margin:0}header{background:#153654;color:white;padding:16px 28px;display:flex;justify-content:space-between;gap:20px}main{background:white;max-width:1440px;margin:24px auto;padding:24px}h1{font-size:24px}fieldset{border:1px solid #c8d1dc;padding:18px;margin:12px 0}legend{font-weight:bold}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px 28px}label{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}input,select,textarea,button{font:inherit;padding:8px;border:1px solid #afbece;border-radius:3px}textarea{min-height:90px}input,select,textarea{max-width:100%;width:100%}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}button{background:white;cursor:pointer}.primary{background:#1c5985;color:white}.danger{color:#ae2534;border-color:#b44d59}button:disabled{cursor:default;color:#8a98a5;background:#f3f5f8}.message{padding:14px;border:1px solid #b6dccc;background:#edf7f3}.error{background:#fff1f1;border-color:#c66}.warning{background:#fff8eb;padding:12px}table{border-collapse:collapse;min-width:1050px;width:100%;font-size:12px}th,td{padding:10px 8px;border:1px solid #d4dee8;vertical-align:top;overflow-wrap:anywhere}th{background:#e6eef6}tr:nth-child(even){background:#f8fafc}.wareki{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.wareki input{width:65px}.wareki select{width:100px}small{color:#5f7183}@media(max-width:760px){main{margin:0;padding:15px}.fields{grid-template-columns:1fr}header{flex-direction:column}}
</style>
</head>
<body>
<header><strong>学生管理システム</strong><span>利用者 ［認証利用者名］　業務日 ［yyyy/MM/dd］</span></header>
<main>
<h1>学生登録 ／新規</h1>
<p>学生管理番号 新規　更新日時 －　更新者 －</p>
<form data-editor-form="" data-http-method="POST" data-route="/students/create">
<input name="__RequestVerificationToken" type="hidden" value=""/>
<input name="SnapshotId" type="hidden" value=""/>
<input name="Input.ExpectedVersion" type="hidden" value=""/>
<input name="Input.ReturnContextId" type="hidden" value=""/>
<input name="Input.DuplicateToken" type="hidden" value=""/>
<fieldset><legend>学生基本情報</legend>
<div class="fields">
<label>学籍番号 ※必須<input id="REG-002" maxlength="30" name="Input.StudentNo" required=""/></label>
<label>氏名 ※必須<input id="REG-003" maxlength="16" name="Input.StudentName" required=""/><small>8文字以内</small></label>
<label>氏名カナ ※必須<input id="REG-004" maxlength="72" name="Input.StudentNameKana" required=""/><small>原入力36、正規化後18文字</small></label>
<fieldset class="wareki" id="REG-005"><legend>生年月日 ※必須</legend><select aria-label="元号" name="Input.BirthDateInput.Era" required=""><option value="">元号</option><option value="REIWA">令和</option><option value="HEISEI">平成</option><option value="SHOWA">昭和</option><option value="TAISHO">大正</option><option value="MEIJI">明治</option></select><input aria-label="元号年" maxlength="4" name="Input.BirthDateInput.Year" required=""/><span>年</span><input aria-label="月" maxlength="2" name="Input.BirthDateInput.Month" required=""/><span>月</span><input aria-label="日" maxlength="2" name="Input.BirthDateInput.Day" required=""/><span>日</span></fieldset>
<label>性別 ※必須<select id="REG-006" name="Input.GenderCode" required=""><option selected="" value="0">未回答</option><option value="1">男性</option><option value="2">女性</option><option value="9">その他</option></select></label>
<label>郵便番号 ※必須<input id="REG-007" maxlength="20" name="Input.PostalCode" required=""/></label>
<label>都道府県 ※必須<select id="REG-008" name="Input.PrefectureCode" required=""><option selected="" value="">未選択</option><option value="01">北海道</option><option value="02">青森県</option><option value="03">岩手県</option><option value="04">宮城県</option><option value="05">秋田県</option><option value="06">山形県</option><option value="07">福島県</option><option value="08">茨城県</option><option value="09">栃木県</option><option value="10">群馬県</option><option value="11">埼玉県</option><option value="12">千葉県</option><option value="13">東京都</option><option value="14">神奈川県</option><option value="15">新潟県</option><option value="16">富山県</option><option value="17">石川県</option><option value="18">福井県</option><option value="19">山梨県</option><option value="20">長野県</option><option value="21">岐阜県</option><option value="22">静岡県</option><option value="23">愛知県</option><option value="24">三重県</option><option value="25">滋賀県</option><option value="26">京都府</option><option value="27">大阪府</option><option value="28">兵庫県</option><option value="29">奈良県</option><option value="30">和歌山県</option><option value="31">鳥取県</option><option value="32">島根県</option><option value="33">岡山県</option><option value="34">広島県</option><option value="35">山口県</option><option value="36">徳島県</option><option value="37">香川県</option><option value="38">愛媛県</option><option value="39">高知県</option><option value="40">福岡県</option><option value="41">佐賀県</option><option value="42">長崎県</option><option value="43">熊本県</option><option value="44">大分県</option><option value="45">宮崎県</option><option value="46">鹿児島県</option><option value="47">沖縄県</option></select></label>
<label>住所1 ※必須<input id="REG-009" maxlength="90" name="Input.AddressLine1" required=""/><small>45文字以内</small></label>
<label>住所2<input id="REG-010" maxlength="90" name="Input.AddressLine2"/></label>
<label>本人電話<input id="REG-011" maxlength="40" name="Input.PhoneNumber"/><small>原入力20、正規化後16文字</small></label>
<label>本人メール<input id="REG-012" maxlength="120" name="Input.EmailAddress"/></label>
<label>入学日 ※必須<input id="REG-013" name="Input.AdmissionDate" required="" type="date"/></label>
<label>在籍区分 ※必須<select id="REG-014" name="Input.EnrollmentStatusCode" required=""><option selected="" value="01">在学</option><option value="02">休学</option><option value="03">卒業</option><option value="04">退学</option></select></label>
<label>卒業・退学日<input id="REG-015" name="Input.EnrollmentEndDate" type="date"/></label>
<label>年度<select id="REG-016" name="Input.SchoolYear"><option value="">未指定</option><option selected="" value="［業務年度］">［描画時の業務年度］</option></select></label>
<label>学年<select id="REG-017" name="Input.GradeCode"><option selected="" value="">すべて</option><option value="00">学年なし</option><option value="01">1年</option><option value="02">2年</option><option value="03">3年</option><option value="04">4年</option><option value="05">5年</option><option value="06">6年</option></select></label>
<label>クラス<select id="REG-018" name="Input.ClassId"><option selected="" value="">未所属</option></select><small>人数 －／定員 制限なし（参考）</small></label>
<label>緊急連絡先氏名<input id="REG-020" maxlength="16" name="Input.EmergencyContactName"/></label>
<label>緊急連絡先続柄<select id="REG-021" name="Input.RelationshipCode"><option selected="" value="">未選択</option><option value="01">父</option><option value="02">母</option><option value="03">祖父</option><option value="04">祖母</option><option value="05">兄弟姉妹</option><option value="06">配偶者</option><option value="07">後見人</option><option value="99">その他</option></select></label>
<label>緊急連絡先電話<input id="REG-022" maxlength="40" name="Input.EmergencyPhoneNumber"/></label>
<label class="full">備考<textarea id="REG-023" maxlength="240" name="Input.Remarks"></textarea></label>
<label class="full">確認・変更理由<textarea id="REG-024" maxlength="120" name="Input.OperationReason"></textarea></label>
</div>
<p>本人電話・メール・緊急電話のいずれか1つ以上。緊急連絡先は3項目すべて入力してください。</p>
<div class="actions"><button class="primary" type="button">登録</button></div>
</fieldset>
</form>
<div class="actions"><form data-confirm="編集内容を読込時の値へ戻しますか。" data-http-method="POST" data-route="/students/reset"><input name="__RequestVerificationToken" type="hidden" value=""/><input name="SnapshotId" type="hidden" value=""/><input name="StudentId" type="hidden" value=""/><button type="button">入力クリア</button></form><a data-dirty-link="" data-route="/students?contextId={ReturnContextId}&amp;contextRevision={ReturnRevision}" href="#検索復帰">検索へ戻る</a></div>
</main>
</body>
</html>
</body></html>
