<!DOCTYPE html>

<html lang="ja">
<head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>学生管理</title>
<style>:root{font-family:Meiryo,"Yu Gothic UI",sans-serif;color:#243448;background:#f2f5f9;font-size:14px}*{box-sizing:border-box}body{margin:0}header{background:#153654;color:white;padding:16px 28px;display:flex;justify-content:space-between;gap:20px}main{background:white;max-width:1440px;margin:24px auto;padding:24px}h1{font-size:24px}fieldset{border:1px solid #c8d1dc;padding:18px;margin:12px 0}legend{font-weight:bold}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px 28px}label{display:flex;flex-direction:column;gap:5px}.full{grid-column:1/-1}input,select,textarea,button{font:inherit;padding:8px;border:1px solid #afbece;border-radius:3px}textarea{min-height:90px}input,select,textarea{max-width:100%;width:100%}.check{display:inline-flex;flex-direction:row;align-items:center;margin-right:12px}.check input{width:auto}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}button{background:white;cursor:pointer}.primary{background:#1c5985;color:white}.danger{color:#ae2534;border-color:#b44d59}button:disabled{cursor:default;color:#8a98a5;background:#f3f5f8}.message{padding:14px;border:1px solid #b6dccc;background:#edf7f3}.error{background:#fff1f1;border-color:#c66}.warning{background:#fff8eb;padding:12px}.grid{overflow-x:auto}table{border-collapse:collapse;min-width:1050px;width:100%;font-size:12px}th,td{padding:10px 8px;border:1px solid #d4dee8;vertical-align:top;overflow-wrap:anywhere}th{background:#e6eef6}tr:nth-child(even){background:#f8fafc}.pager{display:flex;gap:14px;align-items:center;justify-content:center;margin:18px}.wareki{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.wareki input{width:65px}.wareki select{width:100px}.dialog{position:fixed;inset:10% 10%;overflow:auto;padding:28px;background:white;border:3px solid #153654;box-shadow:0 0 0 100vmax #0007;z-index:10}.dialog table{min-width:0}small{color:#5f7183}@media(max-width:760px){main{margin:0;padding:15px}.fields{grid-template-columns:1fr}header{flex-direction:column}.dialog{inset:5%}}</style></head>
<body data-http-status="200" data-outcome="NoChange" data-projection="normal" data-role="Administrator">
<header><strong>学生管理システム</strong><span>利用者 &lt;説明用利用者名・Administrator&gt;　業務日 2026/10/13（説明用・実データなし）</span></header>
<main>
<h1>学生登録 ／編集</h1>
<div aria-live="polite" class="message info">変更はありません。</div>
<p>学生管理番号 &lt;説明用学生ID&gt;　更新日時 &lt;説明用・yyyy/MM/dd HH:mm:ss&gt;　更新者 &lt;説明用更新者&gt;</p>
<form data-editor-form="" data-method="POST" data-route="/students/{id}/update" inert="">
<input name="__RequestVerificationToken" type="hidden" value=""/><input name="SnapshotId" type="hidden" value=""/><input name="Input.ExpectedVersion" type="hidden" value=""/><input name="Input.ReturnContextId" type="hidden" value=""/><input name="Input.DuplicateToken" type="hidden" value=""/>
<fieldset><legend>学生基本情報</legend><div class="fields">
<label>学籍番号 ※必須<input id="REG-002" maxlength="30" name="Input.StudentNo" readonly="" required=""/></label>
<label>氏名 ※必須<input id="REG-003" maxlength="16" name="Input.StudentName" required=""/><small>8文字以内</small></label>
<label>氏名カナ ※必須<input id="REG-004" maxlength="72" name="Input.StudentNameKana" required=""/><small>原入力36、正規化後18文字</small></label>
<fieldset class="wareki" id="REG-005"><legend>生年月日 ※必須</legend><select aria-label="元号" name="Input.BirthDateInput.Era" required=""><option value="">元号</option><option value="REIWA">令和</option><option value="HEISEI">平成</option><option value="SHOWA">昭和</option><option value="TAISHO">大正</option><option value="MEIJI">明治</option></select><input aria-label="元号年" maxlength="4" name="Input.BirthDateInput.Year" required=""/><span>年</span><input aria-label="月" maxlength="2" name="Input.BirthDateInput.Month" required=""/><span>月</span><input aria-label="日" maxlength="2" name="Input.BirthDateInput.Day" required=""/><span>日</span></fieldset>
<label>性別 ※必須<select id="REG-006" name="Input.GenderCode" required=""><option value="0">未回答</option><option value="1">男性</option><option value="2">女性</option><option value="9">その他</option></select></label>
<label>郵便番号 ※必須<input id="REG-007" maxlength="20" name="Input.PostalCode" required=""/></label>
<label>都道府県 ※必須<select id="REG-008" name="Input.PrefectureCode" required=""><option value="">未選択</option><option value="01">北海道</option><option value="02">青森県</option><option value="03">岩手県</option><option value="04">宮城県</option><option value="05">秋田県</option><option value="06">山形県</option><option value="07">福島県</option><option value="08">茨城県</option><option value="09">栃木県</option><option value="10">群馬県</option><option value="11">埼玉県</option><option value="12">千葉県</option><option value="13">東京都</option><option value="14">神奈川県</option><option value="15">新潟県</option><option value="16">富山県</option><option value="17">石川県</option><option value="18">福井県</option><option value="19">山梨県</option><option value="20">長野県</option><option value="21">岐阜県</option><option value="22">静岡県</option><option value="23">愛知県</option><option value="24">三重県</option><option value="25">滋賀県</option><option value="26">京都府</option><option value="27">大阪府</option><option value="28">兵庫県</option><option value="29">奈良県</option><option value="30">和歌山県</option><option value="31">鳥取県</option><option value="32">島根県</option><option value="33">岡山県</option><option value="34">広島県</option><option value="35">山口県</option><option value="36">徳島県</option><option value="37">香川県</option><option value="38">愛媛県</option><option value="39">高知県</option><option value="40">福岡県</option><option value="41">佐賀県</option><option value="42">長崎県</option><option value="43">熊本県</option><option value="44">大分県</option><option value="45">宮崎県</option><option value="46">鹿児島県</option><option value="47">沖縄県</option></select></label>
<label>住所1 ※必須<input id="REG-009" maxlength="90" name="Input.AddressLine1" required=""/><small>45文字以内</small></label>
<label>住所2<input id="REG-010" maxlength="90" name="Input.AddressLine2"/></label>
<label>本人電話<input id="REG-011" maxlength="40" name="Input.PhoneNumber"/><small>原入力20、正規化後16文字</small></label>
<label>本人メール<input id="REG-012" maxlength="120" name="Input.EmailAddress"/></label>
<label>入学日 ※必須<input id="REG-013" name="Input.AdmissionDate" required="" type="date"/></label>
<label>在籍区分 ※必須<select id="REG-014" name="Input.EnrollmentStatusCode" required=""><option value="01">在学</option><option value="02">休学</option><option value="03">卒業</option><option value="04">退学</option></select></label>
<label>卒業・退学日<input id="REG-015" name="Input.EnrollmentEndDate" type="date"/></label>
<label>年度<select id="REG-016" name="Input.SchoolYear"><option value="">未指定</option></select></label>
<label>学年<select id="REG-017" name="Input.GradeCode"><option value="">すべて</option><option value="00">学年なし</option><option value="01">1年</option><option value="02">2年</option><option value="03">3年</option><option value="04">4年</option><option value="05">5年</option><option value="06">6年</option></select></label>
<label>クラス<select id="REG-018" name="Input.ClassId"><option value="">未所属</option></select><small>人数 －／定員 制限なし（参考）</small></label>
<label>緊急連絡先氏名<input id="REG-020" maxlength="16" name="Input.EmergencyContactName"/></label>
<label>緊急連絡先続柄<select id="REG-021" name="Input.RelationshipCode"><option value="">未選択</option><option value="01">父</option><option value="02">母</option><option value="03">祖父</option><option value="04">祖母</option><option value="05">兄弟姉妹</option><option value="06">配偶者</option><option value="07">後見人</option><option value="99">その他</option></select></label>
<label>緊急連絡先電話<input id="REG-022" maxlength="40" name="Input.EmergencyPhoneNumber"/></label>
<label class="full">備考<textarea id="REG-023" maxlength="240" name="Input.Remarks"></textarea></label>
<label class="full">確認・変更理由<textarea id="REG-024" maxlength="120" name="Input.OperationReason"></textarea></label>
</div><p>本人電話・メール・緊急電話のいずれか1つ以上。緊急連絡先は3項目すべて入力してください。</p>
<div class="actions"><button class="primary" type="button">更新</button></div></fieldset></form>
<div class="actions" id="ev-reg-007"><form data-confirm="編集内容を読込時の値へ戻しますか。" data-method="POST" data-route="/students/reset" inert=""><input name="__RequestVerificationToken" type="hidden" value=""/><input name="SnapshotId" type="hidden" value=""/><input name="StudentId" type="hidden" value=""/><button type="button">編集取消</button></form><a data-confirm="編集内容を破棄して最新情報を読み込みますか。" data-dirty-link="" data-method="GET" data-route="/students/{id}?returnContextId={context}" href="#ev-reg-007" inert="">最新情報を再読込</a><a data-dirty-link="" data-method="GET" data-route="/students?contextId={context}&amp;contextRevision={revision}" href="#ev-reg-007" inert="">検索へ戻る</a></div>
<form data-confirm="対象と理由を確認して論理削除しますか。" data-method="POST" data-route="/students/{id}/delete" inert=""><input name="__RequestVerificationToken" type="hidden" value=""/><input name="SnapshotId" type="hidden" value=""/><input name="ExpectedVersion" type="hidden" value=""/><input name="ReturnContextId" type="hidden" value=""/><input name="Confirmed" type="hidden" value="true"/><label>削除理由 ※必須<textarea id="REG-026" maxlength="120" name="Reason" required=""></textarea></label><button class="danger" type="button">対象を確認して論理削除</button><p>編集中の業務値は保存されません。</p></form>
</main></body></html>
