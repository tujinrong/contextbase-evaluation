# パスはリポジトリルートからの相対パス。各領域は重ねないでください。
input = "input"
output = "output"
qa = "qa"
report = "report"
state = ".specgen-state"
max_file_bytes = 2000000
exclude = ["**/*.min.js", "**/*.map", "**/*.g.cs", "**/AssemblyInfo.cs"]

# 未指定時: input直下の各フォルダを1プロジェクトとして再帰走査。
# input直下のソースファイルは _root プロジェクトになります。
# モノレポ等で境界を変える場合だけ明示してください。
# [[projects]]
# name = "sales-api"
# path = "sales/backend"

# 未割当ソースはファイル単位の暫定機能になります。
# 業務機能として複数ファイルをまとめる場合の例:
# [[features]]
# project = "sales-api"
# id = "order_management"
# name = "受注管理"
# summary = "受注の登録・照会を行う。業務担当者が確認した説明を記載する。"
# paths = ["**/OrderController.cs", "**/OrderService.cs", "db/orders.sql"]
