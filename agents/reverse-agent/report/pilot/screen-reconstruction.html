:root {
  --bg: #edf1f4;
  --surface: #ffffff;
  --line: #b8c2cc;
  --line-strong: #6f7b86;
  --text: #18212a;
  --muted: #566370;
  --nav: #16324a;
  --nav-text: #f4f8fb;
  --primary: #0f6b5f;
  --primary-dark: #0a5148;
  --danger: #9d2f2f;
  --button: #e8edf1;
  --button-border: #7b8792;
  --focus: #1a75bb;
  --work-screen-width: 1180px;
}

html {
  min-height: 100%;
}

body {
  min-height: 100vh;
  margin: 0;
  color: var(--text);
  background: var(--bg);
  font-family: "Yu Gothic UI", "Meiryo", "Segoe UI", sans-serif;
}

.app-shell {
  max-width: 1440px;
}

.app-nav {
  min-height: 48px;
  background: var(--nav);
  border-bottom: 1px solid #0c2236;
}

.app-brand,
.app-brand:hover {
  max-width: min(480px, calc(100vw - 96px));
  color: var(--nav-text);
  font-weight: 700;
  letter-spacing: 0;
  line-height: 1.25;
  white-space: normal;
}

.app-nav .nav-link {
  color: var(--nav-text);
  padding: 0.5rem 0.75rem;
}

.app-nav .nav-link:hover,
.app-nav .nav-link:focus {
  color: #ffffff;
  text-decoration: underline;
  text-underline-offset: 4px;
}

.app-main {
  padding: 20px 0 52px;
}

.app-footer {
  padding: 12px 0;
  color: var(--muted);
  border-top: 1px solid var(--line);
}

.surface {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  box-shadow: 0 1px 2px rgba(16, 32, 48, 0.08);
}

.screen {
  padding: 18px;
}

.screen-header {
  display: flex;
  gap: 16px;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 18px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
}

.screen-header.compact {
  margin-bottom: 14px;
}

.screen-header-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: flex-start;
  justify-content: flex-end;
}

.screen-code {
  color: var(--muted);
  font-size: 0.9rem;
}

h1 {
  margin: 0;
  font-size: 1.45rem;
  font-weight: 700;
  letter-spacing: 0;
}

h2 {
  margin: 0 0 10px;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 0;
}

.staff-badge {
  display: grid;
  grid-template-columns: auto auto auto;
  gap: 8px;
  align-items: center;
  min-height: 34px;
  padding: 6px 10px;
  background: #eef7f5;
  border: 1px solid #9fc3bc;
  border-radius: 4px;
  color: var(--primary-dark);
}

.staff-badge strong {
  font-variant-numeric: tabular-nums;
}

.menu-grid {
  display: grid;
  grid-template-columns: minmax(260px, 396px);
  gap: 20px;
  align-items: stretch;
  justify-content: center;
  max-width: 396px;
  margin: 48px auto 0;
}

.access-button {
  display: inline-flex;
  min-height: 42px;
  align-items: center;
  justify-content: center;
  padding: 8px 18px;
  color: var(--text);
  background: var(--button);
  border: 1px solid var(--button-border);
  border-radius: 4px;
  font-weight: 700;
  text-decoration: none;
  line-height: 1.2;
}

.access-button:hover,
.access-button:focus {
  color: var(--text);
  background: #dce5eb;
  border-color: var(--focus);
}

.access-button.primary {
  color: #ffffff;
  background: var(--primary);
  border-color: var(--primary-dark);
}

.access-button.primary:hover,
.access-button.primary:focus {
  color: #ffffff;
  background: var(--primary-dark);
}

.access-button.secondary {
  background: #f4f6f8;
}

.access-button.danger {
  color: #ffffff;
  background: var(--danger);
  border-color: #7c2323;
}

.access-button.narrow {
  min-width: 96px;
}

.access-button:disabled {
  color: #6c757d;
  background: #edf0f2;
  border-color: #c8d0d7;
  cursor: not-allowed;
}

.access-form {
  margin: 0;
}

.staff-screen {
  max-width: 640px;
}

.staff-form {
  max-width: 520px;
}

.excel-export-screen {
  max-width: 640px;
}

.excel-export-form {
  max-width: 560px;
}

.excel-export-branch-row {
  max-width: none;
}

.excel-export-branch-row .input-reference {
  grid-template-columns: minmax(72px, 110px) auto minmax(7em, auto);
}

.excel-export-branch-row .lookup-button {
  min-width: 52px;
  white-space: nowrap;
}

.excel-export-actions {
  margin-left: 182px;
}

.batch-export-screen {
  max-width: 900px;
}

.batch-export-form {
  display: grid;
  gap: 16px;
}

.batch-export-form .staff-row {
  grid-template-columns: 126px minmax(8ch, 12ch) minmax(0, 1fr);
  align-items: center;
}

.staff-code-input {
  width: 10ch;
}

.field-note {
  color: var(--muted);
  font-size: 0.9rem;
}

.batch-options {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  padding-left: 126px;
}

.batch-period-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 16px;
}

.batch-period-panel {
  margin: 0;
  padding: 14px;
  background: #f8fafb;
  border: 1px solid var(--line);
  border-radius: 4px;
}

.batch-period-panel legend {
  float: none;
  width: auto;
  margin: 0 0 10px;
  padding: 0 4px;
  color: var(--text);
  font-size: 1rem;
  font-weight: 700;
  line-height: 1.2;
}

.batch-period-panel .form-row {
  grid-template-columns: 112px 180px auto;
  align-items: center;
}

.batch-date-range {
  grid-template-columns: 112px 180px auto 180px auto !important;
}

.range-separator {
  color: var(--muted);
  font-weight: 700;
}

.form-band {
  margin-top: 14px;
  padding: 14px;
  background: #f8fafb;
  border: 1px solid var(--line);
  border-radius: 4px;
}

.access-layout-band {
  background: #f8fafb;
}

.access-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
  gap: 24px;
  align-items: start;
}

.pension-entry-form .access-layout {
  gap: 36px;
}

.access-column {
  display: grid;
  gap: 10px;
  align-content: start;
}

.access-column h2 {
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
}

.form-grid {
  display: grid;
  gap: 10px 14px;
}

.form-grid.four-cols {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}

.span-2 {
  grid-column: span 2;
}

.span-4 {
  grid-column: span 4;
}

.field-row {
  display: grid;
  grid-template-rows: auto 38px auto;
  gap: 4px;
  min-width: 0;
}

.field-row.access-row {
  grid-template-columns: 170px minmax(0, 1fr);
  grid-template-rows: auto;
  column-gap: 12px;
  align-items: center;
}

.pension-entry-form .field-row.access-row {
  grid-template-columns: 128px minmax(0, 1fr);
  column-gap: 10px;
}

.field-row.access-row label {
  margin: 0;
}

.field-row.access-row .validation-message {
  grid-column: 2;
}

.field-row.access-row.tall {
  align-items: start;
}

.field-row.access-row.tall label {
  padding-top: 8px;
}

.field-row.access-row.tall textarea {
  min-height: 92px;
  resize: vertical;
}

.field-row.access-row-checks {
  align-items: start;
}

.access-check-matrix {
  display: grid;
  grid-template-columns: minmax(130px, 1fr) minmax(160px, 1fr);
  gap: 8px 14px;
}

.access-check-matrix label,
.single-check {
  display: inline-flex;
  min-height: 34px;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  color: var(--muted);
  background: #ffffff;
  border: 1px solid #c5cdd5;
  border-radius: 3px;
  font-size: 0.88rem;
  font-weight: 700;
}

.short-input {
  max-width: 110px;
}

.medium-input {
  max-width: 220px;
}

.input-reference {
  display: inline-grid;
  grid-template-columns: minmax(0, auto) auto minmax(7em, auto);
  gap: 6px;
  align-items: center;
  justify-content: start;
  min-width: 0;
}

.input-reference .form-control {
  width: 100%;
}

.lookup-button {
  display: inline-flex;
  min-height: 38px;
  align-items: center;
  justify-content: center;
  padding: 6px 10px;
  color: var(--text);
  background: #f4f6f8;
  border: 1px solid var(--button-border);
  border-radius: 3px;
  font-size: 0.88rem;
  font-weight: 700;
  line-height: 1.2;
}

.lookup-button:hover,
.lookup-button:focus {
  background: #dce5eb;
  border-color: var(--focus);
}

.lookup-screen {
  max-width: 1180px;
}

.lookup-filter {
  display: grid;
  grid-template-columns: max-content auto;
  gap: 8px 12px;
  align-items: end;
  justify-content: start;
  margin: 0 0 8px;
}

.lookup-filter .button-row {
  justify-self: start;
  align-self: end;
  margin-top: 0;
}

.lookup-keyword-row {
  width: 520px;
  max-width: 520px;
}

.lookup-customer-filter,
.lookup-staff-filter {
  display: grid;
  gap: 12px;
  align-items: end;
}

.lookup-customer-filter {
  grid-template-columns: 110px minmax(240px, 320px) minmax(220px, 300px);
}

.lookup-staff-filter {
  grid-template-columns: 110px minmax(240px, 320px);
}

.lookup-customer-filter .field-row,
.lookup-staff-filter .field-row {
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto auto;
  gap: 4px;
  align-items: start;
}

.lookup-code-row {
  max-width: 110px;
}

.lookup-current {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin: 12px 0;
  color: var(--muted);
  font-size: 0.88rem;
}

.lookup-current strong {
  padding: 4px 8px;
  color: var(--text);
  background: #eef7f5;
  border: 1px solid #9fc3bc;
  border-radius: 3px;
  font-variant-numeric: tabular-nums;
}

.lookup-table-wrap {
  margin-top: 12px;
}

.lookup-results {
  transition: opacity 0.12s ease-in-out;
}

.lookup-results.is-refreshing {
  opacity: 0.62;
}

.lookup-pagination {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 14px;
  align-items: center;
  justify-content: space-between;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}

.lookup-pagination-top {
  display: flex;
  justify-content: flex-end;
  margin: 8px 0 10px;
}

.lookup-pagination-top .lookup-pagination {
  justify-content: flex-end;
  margin-top: 0;
  padding-top: 0;
  border-top: 0;
}

.lookup-pagination__status {
  color: var(--muted);
  font-size: 0.88rem;
  font-weight: 700;
}

.lookup-pagination__links {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}

.lookup-pagination .access-button {
  min-width: 42px;
  min-height: 34px;
  padding: 5px 10px;
}

.lookup-pagination .access-button.active {
  color: #ffffff;
  background: var(--primary);
  border-color: var(--primary-dark);
}

.lookup-pagination .access-button.disabled {
  color: #7b8792;
  background: #edf0f2;
  border-color: #c8d0d7;
  cursor: not-allowed;
}

.lookup-modal[hidden] {
  display: none;
}

.lookup-modal {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: grid;
  place-items: center;
  padding: 24px;
}

.lookup-modal__backdrop {
  position: absolute;
  inset: 0;
  background: rgb(15 23 42 / 52%);
}

.lookup-modal__panel {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  width: min(1120px, 96vw);
  height: min(720px, 90vh);
  overflow: hidden;
  background: var(--surface);
  border: 1px solid #7f8b96;
  border-radius: 4px;
  box-shadow: 0 18px 42px rgb(15 23 42 / 34%);
}

.lookup-modal__header {
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  background: #e8eef2;
  border-bottom: 1px solid var(--line);
}

.lookup-modal__header h2 {
  margin: 0;
  color: var(--text);
  font-size: 1rem;
  font-weight: 800;
}

.lookup-modal__close {
  min-height: 34px;
  padding: 5px 12px;
  color: var(--text);
  background: #ffffff;
  border: 1px solid var(--button-border);
  border-radius: 3px;
  font-size: 0.88rem;
  font-weight: 700;
}

.lookup-modal__frame {
  width: 100%;
  height: 100%;
  border: 0;
  background: #f8fafb;
}

.lookup-modal-open {
  overflow: hidden;
}

.message-box[hidden] {
  display: none;
}

.message-box {
  position: fixed;
  inset: 0;
  z-index: 1100;
  display: grid;
  place-items: center;
  padding: 20px;
}

.message-box__backdrop {
  position: absolute;
  inset: 0;
  background: rgb(15 23 42 / 36%);
}

.message-box__panel {
  position: relative;
  z-index: 1;
  width: min(440px, calc(100vw - 32px));
  overflow: hidden;
  background: #f7f8f9;
  border: 1px solid #687684;
  border-radius: 3px;
  box-shadow: 0 18px 38px rgb(15 23 42 / 32%);
}

.message-box__titlebar {
  padding: 8px 10px;
  background: #e8eef2;
  border-bottom: 1px solid var(--line);
}

.message-box__titlebar h2 {
  margin: 0;
  color: var(--text);
  font-size: 0.95rem;
  font-weight: 800;
}

.message-box__body {
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr);
  gap: 12px;
  align-items: start;
  min-height: 88px;
  padding: 18px 18px 12px;
}

.message-box__icon {
  display: inline-flex;
  width: 32px;
  height: 32px;
  align-items: center;
  justify-content: center;
  color: #165a87;
  border: 2px solid #165a87;
  border-radius: 50%;
  font-size: 1.15rem;
  font-weight: 800;
  line-height: 1;
}

.message-box__message {
  margin: 2px 0 0;
  line-height: 1.55;
  white-space: pre-line;
}

.message-box__actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  padding: 0 18px 16px;
}

.message-box__actions .access-button {
  min-width: 84px;
  min-height: 34px;
  padding: 6px 14px;
}

.message-box-open {
  overflow: hidden;
}

.lookup-popup-body {
  min-height: 100vh;
  background: #f8fafb;
}

.lookup-popup-main {
  padding: 12px;
}

.lookup-screen-popup {
  max-width: none;
  min-height: calc(100vh - 24px);
  margin: 0;
}

.field-row label,
.check-field {
  color: var(--muted);
  font-size: 0.88rem;
  font-weight: 700;
}

.field-row label.access-red-label {
  color: #c00000;
}

.access-key-locked {
  color: #c00000;
  background-color: #f1f3f5;
}

.access-readonly-display[readonly] {
  color: var(--text);
  background-color: #f1f3f5;
}

.form-control,
.form-select {
  min-height: 38px;
  border-color: #9da9b4;
  border-radius: 3px;
}

.era-date-input {
  display: inline-grid;
  grid-template-columns: minmax(0, 220px) 38px;
  align-items: center;
  width: min(100%, 258px);
}

.era-date-input.compact-era-date {
  grid-template-columns: minmax(0, 142px) 38px;
  width: 180px;
}

.era-date-input .form-control {
  width: 100%;
  border-top-right-radius: 0;
  border-bottom-right-radius: 0;
}

.era-calendar-button {
  position: relative;
  width: 38px;
  min-height: 38px;
  background: #f4f6f8;
  border: 1px solid #9da9b4;
  border-left: 0;
  border-radius: 0 3px 3px 0;
}

.era-calendar-button::before,
.era-calendar-button::after {
  position: absolute;
  content: "";
}

.era-calendar-button::before {
  top: 10px;
  left: 10px;
  width: 16px;
  height: 15px;
  background:
    linear-gradient(#55708a, #55708a) 0 4px / 100% 2px no-repeat,
    linear-gradient(90deg, transparent 0 4px, #d7e0e7 4px 6px, transparent 6px 10px, #d7e0e7 10px 12px, transparent 12px) 0 8px / 100% 2px no-repeat;
  border: 2px solid #55708a;
  border-radius: 2px;
}

.era-calendar-button::after {
  top: 7px;
  left: 14px;
  width: 8px;
  height: 5px;
  border-top: 2px solid #55708a;
  border-bottom: 2px solid #55708a;
}

.era-calendar-button:hover,
.era-calendar-button:focus {
  background: #dce5eb;
  border-color: var(--focus);
}

.era-calendar {
  position: absolute;
  z-index: 20;
  width: 286px;
  padding: 10px;
  color: var(--text);
  background: #ffffff;
  border: 1px solid #8ea0af;
  border-radius: 4px;
  box-shadow: 0 12px 28px rgba(22, 43, 58, 0.22);
}

.era-calendar__header {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr) 34px;
  gap: 8px;
  align-items: center;
  margin-bottom: 8px;
}

.era-calendar__nav {
  min-height: 32px;
  color: var(--text);
  background: #f4f6f8;
  border: 1px solid #c5cdd5;
  border-radius: 3px;
  font-weight: 700;
}

.era-calendar__nav:hover,
.era-calendar__nav:focus {
  background: #dce5eb;
  border-color: var(--focus);
}

.era-calendar__title {
  display: grid;
  gap: 2px;
  text-align: center;
  line-height: 1.2;
}

.era-calendar__title strong {
  font-size: 0.98rem;
}

.era-calendar__title span {
  color: var(--muted);
  font-size: 0.78rem;
}

.era-calendar__weekdays,
.era-calendar__days {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 4px;
}

.era-calendar__weekdays {
  margin-bottom: 4px;
  color: var(--muted);
  font-size: 0.74rem;
  font-weight: 700;
  text-align: center;
}

.era-calendar__empty {
  min-height: 38px;
}

.era-calendar__day {
  display: grid;
  min-height: 38px;
  align-content: center;
  gap: 1px;
  padding: 2px;
  color: var(--text);
  background: #ffffff;
  border: 1px solid transparent;
  border-radius: 3px;
  text-align: center;
}

.era-calendar__day span {
  font-size: 0.9rem;
  line-height: 1;
}

.era-calendar__day:hover,
.era-calendar__day:focus {
  background: #eaf2f7;
  border-color: var(--focus);
}

.era-calendar__day.is-today {
  border-color: #55708a;
}

.era-calendar__weekdays span:first-child,
.era-calendar__day.is-sunday {
  color: #b3261e;
}

.era-calendar__day.is-selected {
  color: #ffffff;
  background: var(--focus);
  border-color: var(--focus);
}

.code-input {
  width: auto;
  box-sizing: border-box;
  font-variant-numeric: tabular-nums;
}

.input-reference .code-input {
  width: 100%;
}

.code-input[style*="--code-width"] {
  width: calc(var(--code-width) + 1.5rem + 2px);
}

.code-name-display {
  min-width: 7em;
  color: var(--text);
  font-size: 0.9rem;
  line-height: 1.25;
  white-space: nowrap;
}

.input-reference__name {
  display: inline-flex;
  min-height: 38px;
  align-items: center;
  padding: 0 2px;
}

.check-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(120px, 1fr));
  gap: 8px;
}

.check-grid label,
.check-field {
  display: inline-flex;
  min-height: 34px;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  background: #ffffff;
  border: 1px solid #c5cdd5;
  border-radius: 3px;
}

.button-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  margin-top: 16px;
