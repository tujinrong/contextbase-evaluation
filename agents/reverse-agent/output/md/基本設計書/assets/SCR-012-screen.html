:root {
  --bg: #edf1f4;
  --surface: #ffffff;
  --line: #b8c2cc;
  --line-strong: #6f7b86;
  --text: #18212a;
  --muted: #566370;
  --nav: #16324a;
  --nav-text: #f4f8fb;
  --primary: #0f6b5f;
  --primary-dark: #0a5148;
  --danger: #9d2f2f;
  --button: #e8edf1;
  --button-border: #7b8792;
  --focus: #1a75bb;
  --work-screen-width: 1180px;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

[hidden] {
  display: none !important;
}

button,
input,
select,
textarea {
  margin: 0;
  font: inherit;
}

button,
[type="button"],
[type="submit"],
[type="reset"] {
  cursor: pointer;
}

button:disabled,
[type="button"]:disabled,
[type="submit"]:disabled,
[type="reset"]:disabled {
  cursor: not-allowed;
}

a {
  color: var(--primary-dark);
}

.container-fluid {
  width: 100%;
  margin-inline: auto;
  padding-inline: 18px;
}

.navbar {
  display: flex;
  align-items: center;
  padding-block: 7px;
}

.app-nav .app-shell {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 18px;
  align-items: center;
}

.navbar-brand {
  display: inline-block;
  margin-right: 8px;
  text-decoration: none;
}

.navbar-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
  align-items: center;
  margin: 0;
  padding: 0;
  list-style: none;
}

.nav-link {
  display: block;
  text-decoration: none;
}

.navbar-collapse {
  display: flex;
  min-width: 0;
  flex: 1 1 auto;
  align-items: center;
}

.navbar-toggler {
  display: none;
}

.form-control,
.form-select {
  display: block;
  width: 100%;
  padding: 6px 10px;
  color: var(--text);
  background: #ffffff;
  border: 1px solid #9da9b4;
  line-height: 1.4;
}

.form-control:focus,
.form-select:focus,
button:focus-visible,
a:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 1px;
}

.form-control:disabled,
.form-select:disabled,
.form-control[readonly] {
  background: #edf0f2;
}

textarea.form-control {
  min-height: 72px;
}

.form-row {
  display: grid;
  gap: 8px 12px;
}

.code-input:not(.form-control) {
  min-height: 38px;
  padding: 6px 10px;
  color: var(--text);
  background: #ffffff;
  border: 1px solid #9da9b4;
  border-radius: 3px;
  line-height: 1.4;
}

.code-input:not(.form-control):focus {
  outline: 2px solid var(--focus);
  outline-offset: 1px;
}

.checkbox-item {
  display: inline-flex;
  min-height: 34px;
  align-items: center;
  gap: 8px;
  color: var(--text);
  font-size: 0.92rem;
  font-weight: 700;
}

input[type="checkbox"],
input[type="radio"] {
  accent-color: var(--primary);
}

.modal-open {
  overflow: hidden;
}

html {
  min-height: 100%;
}

body {
  min-height: 100vh;
  margin: 0;
  color: var(--text);
  background: var(--bg);
  font-family: "Yu Gothic UI", "Meiryo", "Segoe UI", sans-serif;
}

.app-shell {
  width: 100%;
  max-width: 1440px;
  margin-inline: auto;
}

.app-nav {
  display: flex;
  min-height: 48px;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 7px 18px;
  color: var(--nav-text);
  background: var(--nav);
  border-bottom: 1px solid #0c2236;
}

.app-nav.navbar {
  padding: 7px 0;
}

.app-nav__title {
  color: var(--nav-text);
  font-weight: 800;
  line-height: 1.25;
}

.app-nav__meta {
  color: #c9d7e2;
  font-size: 0.82rem;
}

.nav-button {
  min-height: 32px;
  padding: 4px 12px;
  color: var(--nav-text);
  background: #294a64;
  border: 1px solid #8da3b5;
  border-radius: 3px;
  font-weight: 700;
}

.nav-button:hover,
.nav-button:focus {
  background: #365f7d;
  border-color: #ffffff;
}

.app-brand,
.app-brand:hover {
  max-width: min(480px, calc(100vw - 96px));
  color: var(--nav-text);
  font-weight: 700;
  letter-spacing: 0;
  line-height: 1.25;
  white-space: normal;
}

.app-nav .nav-link {
  color: var(--nav-text);
  padding: 0.5rem 0.75rem;
}

.app-nav .nav-link:hover,
.app-nav .nav-link:focus {
  color: #ffffff;
  text-decoration: underline;
  text-underline-offset: 4px;
}

.app-main {
  padding: 20px 0 52px;
}

main.app-shell:not(.login-shell) {
  padding: 20px 18px 52px;
}

.app-footer {
  padding: 12px 0;
  color: var(--muted);
  border-top: 1px solid var(--line);
}

.surface {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  box-shadow: 0 1px 2px rgba(16, 32, 48, 0.08);
}

.screen {
  padding: 18px;
}

.compact-screen {
  max-width: 640px;
  margin-top: 28px;
}

.login-shell {
  display: grid;
  min-height: calc(100vh - 48px);
  place-items: start center;
  padding: 56px 18px 24px;
}

.login-card {
  width: min(100%, 460px);
}

.message {
  margin-bottom: 12px;
  padding: 10px 12px;
  background: #eef7f5;
  border: 1px solid #9fc3bc;
  border-radius: 4px;
}

.message.error {
  color: #6f1f1f;
  background: #fff0f0;
  border-color: #ca8f8f;
}

.hint {
  margin: 14px 0 0;
  color: var(--muted);
  font-size: 0.84rem;
  line-height: 1.5;
}

.screen-header {
  display: flex;
  gap: 16px;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 18px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
}

.screen-header.compact {
  margin-bottom: 14px;
}

.screen-header-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: flex-start;
  justify-content: flex-end;
}

.screen-code {
  color: var(--muted);
  font-size: 0.9rem;
}

h1 {
  margin: 0;
  font-size: 1.45rem;
  font-weight: 700;
  letter-spacing: 0;
}

h2 {
  margin: 0 0 10px;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 0;
}

.staff-badge {
  display: grid;
  grid-template-columns: auto auto auto;
  gap: 8px;
  align-items: center;
  min-height: 34px;
  padding: 6px 10px;
  background: #eef7f5;
  border: 1px solid #9fc3bc;
  border-radius: 4px;
  color: var(--primary-dark);
}

.staff-badge strong {
  font-variant-numeric: tabular-nums;
}

.menu-grid {
  display: grid;
  grid-template-columns: minmax(260px, 396px);
  gap: 20px;
  align-items: stretch;
  justify-content: center;
  max-width: 396px;
  margin: 48px auto 0;
}

.access-button {
  display: inline-flex;
  min-height: 42px;
  align-items: center;
  justify-content: center;
  padding: 8px 18px;
  color: var(--text);
  background: var(--button);
  border: 1px solid var(--button-border);
  border-radius: 4px;
  font-weight: 700;
  text-decoration: none;
  line-height: 1.2;
}

.access-button:hover,
.access-button:focus {
  color: var(--text);
  background: #dce5eb;
  border-color: var(--focus);
}

.access-button.primary {
  color: #ffffff;
  background: var(--primary);
  border-color: var(--primary-dark);
}

.access-button.primary:hover,
.access-button.primary:focus {
  color: #ffffff;
  background: var(--primary-dark);
}

.access-button.secondary {
  background: #f4f6f8;
}

.access-button.danger {
  color: #ffffff;
  background: var(--danger);
  border-color: #7c2323;
}

.access-button.narrow {
  min-width: 96px;
}

.access-button:disabled {
  color: #6c757d;
  background: #edf0f2;
  border-color: #c8d0d7;
  cursor: not-allowed;
}

.access-form {
  margin: 0;
}

.staff-screen {
  max-width: 640px;
}

.staff-form {
  max-width: 520px;
}

.excel-export-screen {
  max-width: 640px;
}

.excel-export-form {
  max-width: 560px;
}

.excel-export-branch-row {
  max-width: none;
}

.excel-export-branch-row .input-reference {
  grid-template-columns: minmax(72px, 110px) auto minmax(7em, auto);
}

.excel-export-branch-row .lookup-button {
  min-width: 52px;
  white-space: nowrap;
}

.excel-export-actions {
  margin-left: 182px;
}

.screen.batch-export-screen {
  width: 1120px;
  min-width: 1040px;
}

.batch-page-header {
  align-items: center;
  margin-bottom: 20px;
  padding-bottom: 16px;
}

.batch-page-title {
  display: grid;
  gap: 5px;
}

.batch-page-title p,
.batch-section-heading p,
.batch-period-heading p {
  margin: 0;
  color: var(--muted);
  font-size: 0.88rem;
}

.batch-export-form {
  display: grid;
  gap: 20px;
}

.batch-condition-card {
  overflow: hidden;
  background: #f7f9fb;
  border: 1px solid #b9c4cd;
  border-radius: 5px;
}

.batch-section-heading {
  display: flex;
  gap: 18px;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  background: #edf2f5;
  border-bottom: 1px solid #c6d0d8;
}

.batch-section-heading h2 {
  margin-bottom: 2px;
  font-size: 1.05rem;
}

.batch-required-note {
  padding: 5px 9px;
  color: #435564;
  background: #ffffff;
  border: 1px solid #c6d0d8;
  border-radius: 3px;
  font-size: 0.78rem;
  font-weight: 700;
  white-space: nowrap;
}

.batch-condition-grid {
  display: grid;
  grid-template-columns: 320px minmax(0, 1fr);
  gap: 26px;
  align-items: start;
  padding: 18px;
}

.batch-staff-filter {
  display: grid;
  gap: 7px;
  align-content: start;
}

.batch-staff-filter > label,
.batch-target-fieldset > legend,
.batch-period-body > label,
.batch-date-field > label {
  color: #3d4d59;
  font-size: 0.84rem;
  font-weight: 700;
}

.batch-staff-input-line {
  display: flex;
  gap: 9px;
  align-items: center;
}

.batch-staff-input-line .staff-code-input {
  width: 128px;
}

.batch-all-staff-badge {
  display: inline-flex;
  min-height: 34px;
  align-items: center;
  padding: 4px 9px;
  color: #2b6258;
  background: #eaf5f2;
  border: 1px solid #a8c9c2;
  border-radius: 3px;
  font-size: 0.8rem;
  font-weight: 700;
  white-space: nowrap;
}

.field-note {
  margin: 0;
  color: var(--muted);
  font-size: 0.8rem;
  line-height: 1.45;
}

.batch-target-fieldset {
  min-width: 0;
  margin: 0;
  padding: 0;
  border: 0;
}

.batch-target-fieldset > legend {
  margin-bottom: 7px;
  padding: 0;
}

.batch-condition-card .batch-options {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  padding: 0;
}

.batch-options .checkbox-item {
  min-height: 62px;
  padding: 9px 11px;
  background: #ffffff;
  border: 1px solid #b9c4cd;
  border-radius: 4px;
  cursor: pointer;
}

.batch-options .checkbox-item:hover,
.batch-options .checkbox-item:focus-within {
  background: #f1f7f6;
  border-color: #6c9f95;
}

.batch-options .checkbox-item input {
  width: 18px;
  height: 18px;
  flex: 0 0 auto;
  margin: 0;
}

.batch-options .checkbox-item > span {
  display: grid;
  gap: 2px;
  line-height: 1.25;
}

.batch-options .checkbox-item strong {
  font-size: 0.92rem;
}

.batch-options .checkbox-item small {
  color: var(--muted);
  font-size: 0.74rem;
  font-weight: 400;
}

.batch-period-grid {
  display: grid;
  grid-template-columns: minmax(360px, 0.78fr) minmax(610px, 1.22fr);
  gap: 18px;
}

.batch-period-card {
  display: grid;
  overflow: hidden;
  min-height: 252px;
  grid-template-rows: auto 1fr auto;
  background: #ffffff;
  border: 1px solid #aebac4;
  border-radius: 5px;
}

.batch-period-card:focus-within {
  border-color: #5b8f85;
  box-shadow: 0 0 0 2px rgba(64, 126, 114, 0.12);
}

.batch-period-heading {
  display: flex;
  gap: 11px;
  align-items: center;
  padding: 14px 17px;
  background: #f1f5f7;
  border-bottom: 1px solid #c8d1d8;
}

.batch-period-heading h2 {
  margin-bottom: 2px;
  font-size: 1.05rem;
}

.batch-period-mark {
  display: grid;
  width: 36px;
  height: 36px;
  flex: 0 0 36px;
  place-items: center;
  color: #ffffff;
  background: #55708a;
  border-radius: 4px;
  font-size: 1rem;
  font-weight: 800;
}

.batch-period-card--monthly .batch-period-mark {
  background: var(--primary);
}

.batch-period-body {
  display: grid;
  gap: 8px;
  align-content: start;
  padding: 18px;
}

.batch-date-control {
  grid-template-columns: minmax(0, 1fr) 38px;
  width: 230px;
}

.batch-date-range {
  display: grid;
  grid-template-columns: minmax(200px, 1fr) 28px minmax(200px, 1fr);
  gap: 7px;
  align-items: end;
}

.batch-date-field {
  display: grid;
  min-width: 0;
  gap: 6px;
}

.batch-date-field .batch-date-control {
  width: 100%;
}

.range-separator {
  display: grid;
  min-height: 38px;
  place-items: center;
  color: var(--muted);
  font-weight: 700;
}

.batch-period-note {
  margin: 3px 0 0;
  color: var(--muted);
  font-size: 0.78rem;
}

.batch-period-actions {
  display: flex;
  justify-content: flex-end;
  padding: 12px 16px;
  background: #f7f9fa;
  border-top: 1px solid #d2d9de;
}

.batch-run-button {
  min-width: 176px;
  min-height: 40px;
}

.form-band {
  margin-top: 14px;
  padding: 14px;
  background: #f8fafb;
  border: 1px solid var(--line);
  border-radius: 4px;
}

.access-layout-band {
  background: #f8fafb;
}

.access-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
  gap: 24px;
  align-items: start;
}

.pension-entry-form .access-layout {
  gap: 36px;
}

.access-column,
.access-section {
  display: grid;
  gap: 10px;
  align-content: start;
}

.access-column h2,
.access-section h2 {
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
}

.form-grid {
  display: grid;
  gap: 10px 14px;
}

.form-grid.four-cols {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}

.span-2 {
  grid-column: span 2;
}

.span-4 {
  grid-column: span 4;
}

.field-row {
  display: grid;
  grid-template-rows: auto 38px auto;
  gap: 4px;
  min-width: 0;
}

.field-row.access-row {
  grid-template-columns: 170px minmax(0, 1fr);
  grid-template-rows: auto;
  column-gap: 12px;
  align-items: center;
}

.pension-entry-form .field-row.access-row {
  grid-template-columns: 128px minmax(0, 1fr);
  column-gap: 10px;
}

.field-row.access-row label {
  margin: 0;
}

.field-row.access-row .validation-message {
  grid-column: 2;
}

.field-row.access-row.tall {
  align-items: start;
}

.field-row.access-row.tall label {
  padding-top: 8px;
}

.field-row.access-row.tall textarea {
  min-height: 92px;
  resize: vertical;
}

.field-row.access-row-checks {
  align-items: start;
}

.access-check-matrix,
.checkbox-grid {
  display: grid;
  grid-template-columns: minmax(130px, 1fr) minmax(160px, 1fr);
  gap: 8px 14px;
}

.access-check-matrix label,
.checkbox-grid label,
.single-check {
  display: inline-flex;
  min-height: 34px;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  color: var(--muted);
  background: #ffffff;
  border: 1px solid #c5cdd5;
  border-radius: 3px;
  font-size: 0.88rem;
  font-weight: 700;
}

.short-input {
  max-width: 110px;
}

.medium-input {
  max-width: 220px;
}

.input-reference {
  display: inline-grid;
  grid-template-columns: minmax(0, auto) auto minmax(7em, auto);
  gap: 6px;
  align-items: center;
  justify-content: start;
  min-width: 0;
}

.input-reference .form-control {
  width: 100%;
}

.lookup-button {
  display: inline-flex;
  min-height: 38px;
  align-items: center;
  justify-content: center;
  padding: 6px 10px;
  color: var(--text);
  background: #f4f6f8;
  border: 1px solid var(--button-border);
  border-radius: 3px;
  font-size: 0.88rem;
  font-weight: 700;
  line-height: 1.2;
}

.lookup-button:hover,
.lookup-button:focus {
  background: #dce5eb;
  border-color: var(--focus);
}

.lookup-screen {
  max-width: 1180px;
}

.lookup-filter {
  display: grid;
  grid-template-columns: max-content auto;
  gap: 8px 12px;
  align-items: end;
  justify-content: start;
  margin: 0 0 8px;
}

.lookup-filter .button-row {
  justify-self: start;
  align-self: end;
  margin-top: 0;
}

.lookup-keyword-row {
  width: 520px;
  max-width: 520px;
}

.lookup-customer-filter,
.lookup-staff-filter,
.lookup-filter-row {
  display: grid;
  gap: 12px;
  align-items: end;
}

.lookup-customer-filter {
  grid-template-columns: 110px minmax(240px, 320px) minmax(220px, 300px);
}

.lookup-staff-filter {
  grid-template-columns: 110px minmax(240px, 320px);
}

.lookup-filter-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.lookup-filter-row .form-control {
  width: min(260px, 100%);
}

.lookup-customer-filter .field-row,
.lookup-staff-filter .field-row {
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto auto;
  gap: 4px;
  align-items: start;
}

.lookup-code-row {
  max-width: 110px;
}

.lookup-current {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin: 12px 0;
  color: var(--muted);
  font-size: 0.88rem;
}

.lookup-current strong {
  padding: 4px 8px;
  color: var(--text);
  background: #eef7f5;
  border: 1px solid #9fc3bc;
  border-radius: 3px;
  font-variant-numeric: tabular-nums;
}

.lookup-table-wrap {
  margin-top: 12px;
}

.lookup-results {
  transition: opacity 0.12s ease-in-out;
}

.lookup-results.is-refreshing {
  opacity: 0.62;
}

.lookup-pagination,
.pagination {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 14px;
  align-items: center;
  justify-content: space-between;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}

.lookup-pagination-top {
  display: flex;
  justify-content: flex-end;
  margin: 8px 0 10px;
}

.lookup-pagination-top .lookup-pagination {
  justify-content: flex-end;
  margin-top: 0;
  padding-top: 0;
  border-top: 0;
}

.lookup-pagination__status {
  color: var(--muted);
  font-size: 0.88rem;
  font-weight: 700;
}

.lookup-pagination__links {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}

.lookup-pagination .access-button,
.pagination button {
  min-width: 42px;
  min-height: 34px;
  padding: 5px 10px;
}

.lookup-pagination .access-button.active,
.pagination button.current {
  color: #ffffff;
  background: var(--primary);
  border-color: var(--primary-dark);
}

.lookup-pagination .access-button.disabled,
.pagination button:disabled {
  color: #7b8792;
  background: #edf0f2;
  border-color: #c8d0d7;

.lookup-modal[hidden] {
  display: none;
}

.lookup-modal {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: grid;
  place-items: center;
  padding: 24px;
}

.lookup-modal__backdrop {
  position: absolute;
  inset: 0;
  background: rgb(15 23 42 / 52%);
}

.lookup-modal__panel {
  position: relative;
  z-index: 1;
  display: grid;

  width: min(1120px, 96vw);
  height: min(720px, 90vh);
  overflow: hidden;
  background: var(--surface);
  border: 1px solid #7f8b96;
  border-radius: 4px;
  box-shadow: 0 18px 42px rgb(15 23 42 / 34%);

.lookup-modal__header {
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  background: #e8eef2;
  border-bottom: 1px solid var(--line);
}

.lookup-modal__header h2 {
  margin: 0;
  color: var(--text);
  font-size: 1rem;
  font-weight: 800;
}

.lookup-modal__close {
  min-height: 34px;
  padding: 5px 12px;
  color: var(--text);
  background: #ffffff;
  border: 1px solid var(--button-border);
  border-radius: 3px;
  font-size: 0.88rem;
  font-weight: 700;
}

.lookup-modal__frame {
  width: 100%;
  height: 100%;
  border: 0;
  background: #f8fafb;
}

.lookup-modal-open {
  overflow: hidden;
}

.message-box[hidden] {
  display: none;
}

.message-box {
  position: fixed;
  inset: 0;
  z-index: 1100;
  display: grid;
  place-items: center;
  padding: 20px;
}

.message-box__backdrop {
  position: absolute;
  inset: 0;
  background: rgb(15 23 42 / 36%);
}

.message-box__panel {
  position: relative;
  z-index: 1;
  width: min(440px, calc(100vw - 32px));
  overflow: hidden;
  background: #f7f8f9;
  border: 1px solid #687684;
  border-radius: 3px;
  box-shadow: 0 18px 38px rgb(15 23 42 / 32%);
}

.message-box__titlebar {
  padding: 8px 10px;
  background: #e8eef2;
  border-bottom: 1px solid var(--line);
}

.message-box__titlebar h2 {
  margin: 0;
  color: var(--text);
  font-size: 0.95rem;
  font-weight: 800;
}

.message-box__body {
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr);
  gap: 12px;
  align-items: start;
  min-height: 88px;
  padding: 18px 18px 12px;
}

.message-box__icon {
  display: inline-flex;
  width: 32px;
  height: 32px;
  align-items: center;
  justify-content: center;
  color: #165a87;
  border: 2px solid #165a87;
  border-radius: 50%;
  font-size: 1.15rem;
  font-weight: 800;
  line-height: 1;
}

.message-box__message {
  margin: 2px 0 0;
  line-height: 1.55;
  white-space: pre-line;
}

.message-box__actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  padding: 0 18px 16px;
}

.message-box__actions .access-button {
  min-width: 84px;
  min-height: 34px;
  padding: 6px 14px;
}

.message-box-open {
  overflow: hidden;
}

.lookup-popup-body {
  min-height: 100vh;
  background: #f8fafb;
}

.lookup-popup-main {
  padding: 12px;
}

.lookup-screen-popup {
  max-width: none;
  min-height: calc(100vh - 24px);
  margin: 0;
}

.field-row label,
.check-field {
  color: var(--muted);
  font-size: 0.88rem;
  font-weight: 700;
}

.field-row label.access-red-label {
  color: #c00000;
}

.access-key-locked {
  color: #c00000;
  background-color: #f1f3f5;
}

.access-readonly-display[readonly] {
  color: var(--text);
  background-color: #f1f3f5;
}

.form-control,
.form-select {
  min-height: 38px;
  border-color: #9da9b4;
  border-radius: 3px;
}

.era-date-input,
.calendar-input {
  display: inline-grid;
  grid-template-columns: minmax(0, 220px) 38px;
  align-items: center;
  width: min(100%, 258px);
}

.era-date-input.compact-era-date {
  grid-template-columns: minmax(0, 142px) 38px;
  width: 180px;
}

.era-date-input .form-control,
.calendar-input .form-control {
  width: 100%;
  border-top-right-radius: 0;
  border-bottom-right-radius: 0;
}

.era-calendar-button {
  position: relative;
  width: 38px;
  min-height: 38px;
  background: #f4f6f8;
  border: 1px solid #9da9b4;
  border-left: 0;
  border-radius: 0 3px 3px 0;
}

.era-calendar-button::before,
.era-calendar-button::after {
  position: absolute;
  content: "";
}

.era-calendar-button::before {
  top: 10px;
  left: 10px;
  width: 16px;
  height: 15px;
  background:
    linear-gradient(#55708a, #55708a) 0 4px / 100% 2px no-repeat,
    linear-gradient(90deg, transparent 0 4px, #d7e0e7 4px 6px, transparent 6px 10px, #d7e0e7 10px 12px, transparent 12px) 0 8px / 100% 2px no-repeat;
  border: 2px solid #55708a;
  border-radius: 2px;
}

.era-calendar-button::after {
  top: 7px;
  left: 14px;
  width: 8px;
  height: 5px;
  border-top: 2px solid #55708a;
  border-bottom: 2px solid #55708a;
}

.era-calendar-button:hover,
.era-calendar-button:focus {
  background: #dce5eb;
  border-color: var(--focus);
}

.era-calendar {
  position: absolute;
  z-index: 1200;
  width: 286px;
  padding: 10px;
  color: var(--text);
  background: #ffffff;
  border: 1px solid #8ea0af;
  border-radius: 4px;
  box-shadow: 0 12px 28px rgba(22, 43, 58, 0.22);
}

.era-calendar__header {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr) 34px;
  gap: 8px;
  align-items: center;
  margin-bottom: 8px;
}

.era-calendar__nav {
  min-height: 32px;
  color: var(--text);
  background: #f4f6f8;
  border: 1px solid #c5cdd5;
  border-radius: 3px;
  font-weight: 700;
}

.era-calendar__nav:hover,
.era-calendar__nav:focus {
  background: #dce5eb;
  border-color: var(--focus);
}

.era-calendar__title {
  display: grid;
  gap: 2px;
  text-align: center;
  line-height: 1.2;
}

.era-calendar__title strong {
  font-size: 0.98rem;
}

.era-calendar__title span {
  color: var(--muted);
  font-size: 0.78rem;
}

.era-calendar__weekdays,
.era-calendar__days {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 4px;
}

.era-calendar__weekdays {
  margin-bottom: 4px;
  color: var(--muted);
  font-size: 0.74rem;
  font-weight: 700;
  text-align: center;
}

.era-calendar__empty {
  min-height: 38px;
}

.era-calendar__day {
  display: grid;
  min-height: 38px;
  align-content: center;
  gap: 1px;
  padding: 2px;
  color: var(--text);
  background: #ffffff;
  border: 1px solid transparent;
  border-radius: 3px;
  text-align: center;
}

.era-calendar__day span {
  font-size: 0.9rem;
  line-height: 1;
}

.era-calendar__day:hover,
.era-calendar__day:focus {
  background: #eaf2f7;
  border-color: var(--focus);
}

.era-calendar__day.is-today {
  border-color: #55708a;
}

.era-calendar__weekdays span:first-child,
.era-calendar__day.is-sunday {
  color: #b3261e;
}

.era-calendar__day.is-selected {
  color: #ffffff;
  background: var(--focus);
  border-color: var(--focus);
}

.code-input {
  width: auto;
  box-sizing: border-box;
  font-variant-numeric: tabular-nums;
}

.input-reference .code-input {
  width: 100%;
}

.code-input[style*="--code-width"] {
  width: calc(var(--code-width) + 1.5rem + 2px);
}

.code-name-display {
  min-width: 7em;
  color: var(--text);
  font-size: 0.9rem;
  line-height: 1.25;
  white-space: nowrap;
}

.input-reference__name {
  display: inline-flex;
  min-height: 38px;
  align-items: center;
  padding: 0 2px;
}

.check-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(120px, 1fr));
  gap: 8px;
}

.check-grid label,
.check-field {
  display: inline-flex;
  min-height: 34px;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  background: #ffffff;
  border: 1px solid #c5cdd5;
  border-radius: 3px;
}

.button-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  margin-top: 16px;
}

.sticky-actions {
  position: sticky;
  bottom: 0;
  z-index: 2;
  padding: 10px 0 0;
  background: var(--surface);
  border-top: 1px solid var(--line);
}

.status-message,
.validation-summary {
  margin-bottom: 12px;
  padding: 10px 12px;
  background: #fff8df;
  border: 1px solid #d5b75f;
  border-radius: 4px;
  color: #4d3a00;
}

.validation-message {
  color: var(--danger);
  font-size: 0.86rem;
}

.table-wrap {
  overflow-x: auto;
}

.access-table,
.report-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.9rem;
}

.access-table th,
.access-table td,
.report-table th,
.report-table td {
  padding: 6px 8px;
  border: 1px solid var(--line);
  white-space: nowrap;
  vertical-align: top;
}

.access-table th,
.report-table th {
  background: #e8edf1;
  font-weight: 700;
}

.access-code-center {
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.access-code-right {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.table-action {
  min-height: 30px;
  padding: 3px 10px;
  background: var(--button);
  border: 1px solid var(--button-border);
  border-radius: 3px;
  font-weight: 700;
}

.screen.report-screen {
  width: 1180px;
  min-width: 1080px;
}

.report-page-header {
  align-items: center;
  margin-bottom: 20px;
  padding-bottom: 16px;
}

.report-page-title {
  display: grid;
  gap: 5px;
}

.report-page-title p,
.report-filter-heading p,
.report-preview-toolbar p {
  margin: 0;
  color: var(--muted);
  font-size: 0.88rem;
}

.report-filter-form {
  overflow: hidden;
  background: #f7f9fb;
  border: 1px solid #b9c4cd;
  border-radius: 5px;
}

.report-filter-heading {
  display: flex;
  gap: 18px;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  background: #edf2f5;
  border-bottom: 1px solid #c6d0d8;
}

.report-filter-heading h2 {
  margin-bottom: 2px;
  font-size: 1.05rem;
}

.report-filter-heading > span {
  padding: 5px 9px;
  color: #435564;
  background: #ffffff;
  border: 1px solid #c6d0d8;
  border-radius: 3px;
  font-size: 0.78rem;
  font-weight: 700;
}

.report-filter-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.25fr) minmax(390px, 0.75fr);
  gap: 18px;
  padding: 18px;
}

.report-filter-panel {
  min-width: 0;
  margin: 0;
  padding: 14px;
  background: #ffffff;
  border: 1px solid #bdc7cf;
  border-radius: 4px;
}

.report-filter-panel > legend {
  margin: 0 0 9px;
  padding: 0 4px;
  color: #3d4d59;
  font-size: 0.84rem;
  font-weight: 700;
}

.report-sort-options {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
}

.report-radio-card {
  display: flex;
  min-height: 52px;
  gap: 9px;
  align-items: center;
  padding: 8px 10px;
  background: #ffffff;
  border: 1px solid #b9c4cd;
  border-radius: 4px;
  cursor: pointer;
}

.report-radio-card:hover,
.report-radio-card:focus-within {
  background: #f1f7f6;
  border-color: #6c9f95;
}

.report-radio-card:has(input:checked) {
  background: #eaf5f2;
  border-color: #5b8f85;
  box-shadow: inset 3px 0 0 var(--primary);
}

.report-radio-card input,
.report-branch-toggle input {
  width: 18px;
  height: 18px;
  flex: 0 0 auto;
  margin: 0;
}

.report-radio-card > span,
.report-branch-toggle > span {
  display: grid;
  gap: 2px;
  line-height: 1.2;
}

.report-radio-card strong,
.report-branch-toggle strong {
  font-size: 0.9rem;
}

.report-radio-card small,
.report-branch-toggle small {
  color: var(--muted);
  font-size: 0.74rem;
  font-weight: 400;
}

.report-branch-panel {
  display: grid;
  gap: 10px;
  align-content: start;
}

.report-branch-toggle {
  display: flex;
  min-height: 45px;
  gap: 9px;
  align-items: center;
  padding: 7px 10px;
  background: #f5f7f9;
  border: 1px solid #c5cdd5;
  border-radius: 4px;
  cursor: pointer;
}

.report-branch-toggle:has(input:checked) {
  background: #eaf5f2;
  border-color: #5b8f85;
}

.report-branch-range {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 24px minmax(0, 1fr);
  gap: 7px;
  align-items: end;
}

.report-branch-field {
  display: grid;
  gap: 5px;
}

.report-branch-field label {
  color: #3d4d59;
  font-size: 0.78rem;
  font-weight: 700;
}

.branch-range-separator {
  display: grid;
  min-height: 38px;
  place-items: center;
  color: var(--muted);
  font-weight: 700;
}

.report-branch-range input:disabled {
  color: #78838c;
  background: #edf0f2;
  border-color: #c8d0d7;
}

.report-filter-note {
  margin: 0;
  color: var(--muted);
  font-size: 0.76rem;
}

.report-filter-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 18px;
  background: #f1f4f6;
  border-top: 1px solid #c6d0d8;
}

.report-preview-status {
  display: flex;
  gap: 8px;
  align-items: baseline;
  color: var(--muted);
  font-size: 0.82rem;
}

.report-preview-status strong {
  color: var(--text);
  font-size: 0.94rem;
}

.report-action-buttons {
  display: flex;
  gap: 10px;
}

.report-action-buttons .access-button {
  min-width: 150px;
  min-height: 40px;
}

.report-print-button:not(:disabled) {
  color: #ffffff;
  background: #405b72;
  border-color: #32495d;
}

.report-preview-shell {
  display: grid;
  gap: 22px;
  margin-top: 24px;
}

.report-preview-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: #eef2f5;
  border: 1px solid #c1cbd3;
  border-radius: 4px;
}

.report-preview-toolbar h2 {
  margin-bottom: 2px;
  font-size: 1.05rem;
}

.report-preview-toolbar > div:last-child {
  display: grid;
  grid-template-columns: auto auto auto auto;
  gap: 6px 10px;
  align-items: center;
  color: var(--muted);
  font-size: 0.8rem;
}

.report-preview-toolbar strong {
  color: var(--text);
}

.report-empty-state {
  display: grid;
  min-height: 180px;
  place-content: center;
  gap: 6px;
  color: var(--muted);
  background: #ffffff;
  border: 1px dashed #aeb9c2;
  text-align: center;
}

.report-empty-state strong {
  color: var(--text);
  font-size: 1.05rem;
}

.report-page {
  overflow: hidden;
  background: #ffffff;
  border: 1px solid #9eabb5;
  border-radius: 3px;
  box-shadow: 0 5px 16px rgba(31, 48, 60, 0.1);
  break-after: page;
  page-break-after: always;
}

.report-page:last-child {
  break-after: auto;
  page-break-after: auto;
}

.report-ledger {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

.report-ledger th,
.report-ledger td {
  padding: 0;
  background: transparent;
  border: 0;
  text-align: left;
  vertical-align: top;
}

.report-print-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 16px 9px;
}

.report-print-title h2 {
  margin: 0;
  font-size: 1.18rem;
}

.report-print-title > div,
.report-branch-band > div {
  display: flex;
  gap: 7px;
  align-items: baseline;
  color: var(--muted);
  font-size: 0.75rem;
}

.report-print-title strong,
.report-branch-band strong {
  color: var(--text);
  font-variant-numeric: tabular-nums;
}

.report-branch-band {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 34px;
  padding: 5px 16px;
  background: #edf3f6;
  border-top: 1px solid #b9c5cd;
  border-bottom: 1px solid #9eabb5;
}

.report-branch-band > div:first-child strong {
  font-size: 1rem;
}

.report-ledger-grid {
  display: grid;
  grid-template-columns: 0.7fr 0.55fr 1.5fr 1.25fr 0.42fr 1.1fr 1fr 0.42fr 1fr 0.42fr 0.75fr 1.4fr;
  grid-template-areas:
    "customer staff name kana gender phone birth claim claimdate age request request"
    ". . address address address spouse benefit spousebirth spousebirth pension pension notes";
  min-width: 0;
}

.report-ledger-grid--head {
  grid-template-rows: 22px 22px;
  color: #2f414e;
  background: #dfe7ec;
  font-size: 0.66rem;
  font-weight: 700;
}

.report-ledger-grid--row {
  grid-template-rows: 25px 25px;
  font-size: 0.67rem;
}

.report-ledger tbody tr:nth-child(even) .report-ledger-grid--row {
  background: #fafcfd;
}

.report-ledger tbody tr:hover .report-ledger-grid--row {
  background: #f0f7f6;
}

.report-cell {
  display: flex;
  min-width: 0;
  align-items: center;
  overflow: hidden;
  padding: 3px 4px;
  border-right: 1px solid #c7d0d6;
  border-bottom: 1px solid #c7d0d6;
  line-height: 1.15;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.report-cell--customer { grid-area: customer; justify-content: center; }
.report-cell--staff { grid-area: staff; justify-content: center; }
.report-cell--name { grid-area: name; }
.report-cell--kana { grid-area: kana; }
.report-cell--gender { grid-area: gender; justify-content: center; }
.report-cell--phone { grid-area: phone; }
.report-cell--birth { grid-area: birth; justify-content: center; }
.report-cell--claim { grid-area: claim; justify-content: center; }
.report-cell--claim-date { grid-area: claimdate; justify-content: center; }
.report-cell--age { grid-area: age; justify-content: center; }
.report-cell--request { grid-area: request; justify-content: center; }
.report-cell--address { grid-area: address; }
.report-cell--spouse { grid-area: spouse; }
.report-cell--benefit { grid-area: benefit; justify-content: center; }
.report-cell--spouse-birth { grid-area: spousebirth; justify-content: center; }
.report-cell--pension { grid-area: pension; }
.report-cell--notes { grid-area: notes; border-right: 0; }

.screen:not(.lookup-screen-popup) {
  max-width: var(--work-screen-width);
  margin-right: auto;
  margin-left: auto;
}

@media (max-width: 960px) {
  .form-grid.four-cols,
  .check-grid,
  .menu-grid {
    grid-template-columns: 1fr 1fr;
  }

  .print-condition-grid {
    grid-template-columns: 1fr;
  }

  .access-layout {
    grid-template-columns: 1fr;
  }

  .field-row.access-row {
    grid-template-columns: 150px minmax(0, 1fr);
  }

  .pension-entry-form .access-layout {
    gap: 24px;
  }

  .pension-entry-form .field-row.access-row {
    grid-template-columns: 128px minmax(0, 1fr);
  }

  .excel-export-actions {
    margin-left: 162px;
  }

  .batch-options {
    padding-left: 0;
  }

  .span-4 {
    grid-column: span 2;
  }
}

@media (max-width: 640px) {
  .container-fluid {
    padding-inline: 10px;
  }

  .app-nav .app-shell,
  .navbar-collapse {
    width: 100%;
  }

  .navbar-nav {
    gap: 0;
  }

  .app-nav .nav-link {
    padding-right: 10px;
    padding-left: 0;
  }

  .screen-header {
    display: grid;
  }

  .form-grid.four-cols,
  .check-grid,
  .menu-grid {
