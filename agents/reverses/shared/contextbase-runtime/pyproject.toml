[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextbase-runtime"
version = "0.1.0"
description = "Shared source-analysis runtime with sealed evidence and independent verification"
requires-python = ">=3.11"
dependencies = ["jsonschema==4.25.1"]

[project.optional-dependencies]
analysis = ["tree-sitter==0.25.2", "tree-sitter-c-sharp==0.23.5", "tree-sitter-java==0.23.5"]
images = ["Pillow>=10,<13"]

[tool.setuptools.packages.find]
where = ["src"]
