[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextbase-relationship"
version = "0.1.0"
description = "Independent relationship extraction over revalidated catalogs"
requires-python = ">=3.11"
dependencies = ["contextbase-runtime==0.1.0"]

[project.scripts]
contextbase-relationship = "contextbase_relationship.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
