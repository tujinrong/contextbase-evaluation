[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextbase-discovery"
version = "0.1.0"
description = "Independent source catalog and system discovery agent"
requires-python = ">=3.11"
dependencies = ["contextbase-runtime==0.1.0"]

[project.scripts]
contextbase-discovery = "contextbase_discovery.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
