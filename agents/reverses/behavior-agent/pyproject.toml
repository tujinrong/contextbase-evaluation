[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextbase-behavior"
version = "0.1.0"
description = "Independent behavior extraction over revalidated relationships"
requires-python = ">=3.11"
dependencies = ["contextbase-runtime==0.1.0"]

[project.scripts]
contextbase-behavior = "contextbase_behavior.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
