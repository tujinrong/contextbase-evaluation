<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>業務Web UI｜HTMLレイアウト設計書</title><style>/* 業務Web UI 標準 v1.0。値はプロジェクト用初期値。フォント配信なし。 */

.button, button { display: inline-flex; justify-content: center; align-items: center; gap: .5rem; min-height: var(--control-min); padding: .5rem 1rem; border: 1px solid var(--color-border); border-radius: var(--radius-control); background: white; color: var(--color-text); text-decoration: none; font-weight: 600; font-size: var(--font-ui); line-height: 1.5; }
.button:hover, button:hover { background: #F1F5F9; }
.primary { background: var(--color-primary); color: white; border-color: var(--color-primary); }

.danger { color: var(--color-danger); border-color: var(--color-danger); }

.actions { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; }

.table-panel { padding: 0; overflow: hidden; }

label, .field-label { display: block; font-size: var(--font-ui); font-weight: 600; margin-bottom: .25rem; }
input:not([type=checkbox]):not([type=radio]), select, textarea { width: 100%; max-width: 100%; min-height: var(--control-min); padding: .5rem .75rem; border: 1px solid var(--color-border); background: white; color: var(--color-text); border-radius: var(--radius-control); }
input[readonly] { background: var(--color-bg) !important; }
textarea { min-height: var(--textarea-min); resize: vertical; }

.inline-check { display: flex; align-items: center; gap: .5rem; min-height: 2.5rem; font-weight: 400; }

.help { font-size: var(--font-help); line-height: 1.5; color: var(--color-muted); margin: .375rem 0 0; }
.small { font-size: var(--font-help); }

.form-grid > * { min-width: 0; }
.form-full { grid-column: 1 / -1; }
.form-width { max-width: var(--form-max); }
.short-field { max-width: 12rem; }
.medium-field { max-width: 20rem; }
.form-section + .form-section { margin-top: 1.5rem; border-top: 1px solid var(--color-divider); padding-top: 1.5rem; }
.action-bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; padding: 1rem 0; }

.data-table { min-width: 44rem; }
caption { text-align: left; font-weight: 600; padding: 1rem; }
th { text-align: left; background: #F8FAFC; color: #344054; font-weight: 600; }
th, td { padding: var(--cell-y) var(--cell-x); border-bottom: 1px solid var(--color-divider); vertical-align: middle; height: var(--row-min); }

tbody tr:hover { background: #FAFBFD; }
.numeric { text-align: right; font-variant-numeric: tabular-nums; }
.nowrap { white-space: nowrap; }
.name-cell { min-width: 12rem; max-width: 25rem; overflow-wrap: anywhere; }
.code { font-family: var(--font-mono); font-size: var(--font-help); white-space: nowrap; }
.row-link { font-size: var(--font-ui); padding: .5rem; margin: -.5rem; display: inline-flex; align-items: center; min-height: 2.5rem; }
.sort-button { min-height: 2rem; border: 0; padding: 0; color: inherit; background: transparent; font-size: inherit; }
.badge { display: inline-block; border-radius: .25rem; padding: .125rem .5rem; font-size: var(--font-help); font-weight: 600; white-space: nowrap; color: #344054; background: #EDF1F5; }
.badge.blue { color: #1E40AF; background: #EAF1FF; }
.badge.green { color: var(--color-success); background: #EAF7EE; }
.badge.amber { color: var(--color-warning); background: #FFF5D9; }
.badge.red { color: var(--color-danger); background: #FEECEB; }
.pagination { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; padding: 1rem 1.5rem; border-top: 1px solid var(--color-divider); font-size: var(--font-help); }
.pagination nav { display: flex; flex-wrap: wrap; gap: .5rem; }
.page-link { min-width: var(--control-min); min-height: var(--control-min); padding: .5rem; }

.header-tools .size-control select { width: 12rem; max-width: 100%; }
.spec { margin-top: 1.5rem; background: #F9FAFC; border: 1px dashed var(--color-border); border-radius: .5rem; padding: 1rem 1.25rem; font-size: var(--font-help); }

.spec-body { margin-top: 1rem; }

.empty h2 { margin-bottom: .5rem; }

.metrics { display: grid; grid-template-columns: repeat(auto-fit,minmax(min(100%,12rem),1fr)); gap: 1rem; margin-bottom: 1.5rem; }

.two-panels { display: grid; grid-template-columns: minmax(0,1fr); gap: 1.5rem; }
.task-list { padding: 0; margin: 0; list-style: none; }
.task-list li { padding: 1rem 0; border-bottom: 1px solid var(--color-divider); }
.task-list li:last-child { border: 0; }

.master-layout { display: grid; grid-template-columns: minmax(0,1fr); gap: 1.5rem; align-items: start; }
.master-item { width: 100%; display: block; text-align: left; margin-bottom: .5rem; padding: 1rem; border-color: var(--color-divider); font-weight: 400; }

.pattern-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(min(100%,19rem),1fr)); gap: 1rem; }
.pattern-card { margin: 0; }
.pattern-card .code { white-space: normal; overflow-wrap: anywhere; color: var(--color-primary); margin-bottom: .5rem; }
.pattern-card h2 { margin-bottom: .5rem; }
.pattern-card p { font-size: var(--font-help); }

.step-list { display: flex; gap: .75rem; flex-wrap: wrap; list-style: none; margin: 0 0 1.5rem; padding: 0; }
.step-list li { padding: .5rem .75rem; background: #EDF1F5; border-radius: .375rem; font-size: var(--font-ui); }
.step-list li.active { background: var(--color-selected); color: var(--color-primary); font-weight: 600; }
.upload-box { border: 2px dashed var(--color-border); padding: 1.5rem; border-radius: .5rem; margin-bottom: 1rem; }
.notice { padding: .75rem 1rem; background: #EAF7EE; border: 1px solid #8AAA95; border-radius: .375rem; font-size: var(--font-help); margin-bottom: 1rem; }
dialog { border: 1px solid var(--color-divider); border-radius: .75rem; padding: 1.5rem; max-width: 34rem; width: calc(100% - 2rem); color: var(--color-text); box-shadow: 0 16px 60px rgb(0 0 0 / 20%); }
dialog::backdrop { background: rgb(15 23 42 / 45%); }
dialog .actions { margin-top: 1.5rem; justify-content: flex-end; }
@container (min-width: 45rem) { .form-grid { grid-template-columns: repeat(2,minmax(0,1fr)); } .facts { grid-template-columns: repeat(2,minmax(0,1fr)); } .two-panels { grid-template-columns: 1.2fr 1fr; } }
@container (min-width: 55rem) { .master-layout { grid-template-columns: minmax(16rem, .36fr) minmax(0,.64fr); } }
@media (max-width: 63.999rem) { .header { position: static; } .shell { grid-template-columns: minmax(0,1fr); } .sidebar { display: none; position: static; height: auto; border-bottom: 1px solid var(--color-divider); } .sidebar.open { display: block; } .menu-toggle { display: inline-flex; } .header-tools .user { display: none; } }

@media print { .header, .sidebar, .prototype, .spec, .no-print, .breadcrumbs { display: none !important; } .shell { display:block; } main { padding: 0; } .panel { box-shadow:none; break-inside:avoid; } body { background:white; } }

function renderHome(){return head('ホーム','業務の入口と要対応事項を集約するパターン',link('対象一覧へ','#/list','button primary'))+`<div class="metrics"><section class="panel metric"><div class="small muted">要確認の申請</div><div class="metric-value">3<small>件</small></div><a href="#/approval" class="small">承認・レビューを開く</a></section><section class="panel metric"><div class="small muted">進行中の対象</div><div class="metric-value">19<small>件</small></div><a href="${href('list',{status:'進行中'})}" class="small">進行中の一覧を見る</a></section><section class="panel metric"><div class="small muted">処理エラー</div><div class="metric-value">1<small>件</small></div><a href="#/jobs" class="small">処理状況を確認する</a></section></div><div class="two-panels"><section class="panel"><h2>次に行うこと</h2><ul class="task-list"><li><a href="#/approval">申請内容のレビュー</a><p class="help">判断待ちの内容と変更差分を確認します。</p></li><li><a href="#/jobs">失敗した取込の結果確認</a><p class="help">失敗理由を確認してから再実行します。</p></li><li><a href="#/edit">新しい対象を登録</a><p class="help">入力内容は最後にまとめて保存します。</p></li></ul></section><section class="panel"><h2>最近利用した対象</h2><ul class="task-list">${data.slice(0,3).map(r=>`<li><a href="${href('detail',{id:r.id})}">${esc(r.name)}</a><p class="help">${r.id} · ${r.category} · ${r.date}</p></li>`).join('')}</ul></section></div>`+specs('SCR-HOME','未処理事項と最近利用した対象への入口','カードから対応画面へリンク。指標はすべて架空の例示値。','通常、0件、取得失敗','不要な独立メニュー画面を経由せず、業務を開始できる。');}

function renderImport(){return head('ファイル取込','選択 → 検証 → 確認 → 取込を分離する')+`<div class="form-width"><ol class="step-list"><li class="active">1 ファイル選択</li><li>2 検証結果</li><li>3 取込実行</li><li>4 結果確認</li></ol><section class="panel"><h2>ファイルを選択</h2><div class="upload-box"><label for="import-file">CSVファイル（デモ）</label><input id="import-file" type="file" accept=".csv,text/csv"><p class="help">このHTMLはファイル内容を読み取りません。選択後、架空の検証結果を表示します。</p></div><button type="button" class="primary" data-action="validate-import">検証結果の見本を表示</button></section><div id="import-result" hidden><section class="panel"><h2>検証結果の見本</h2><div class="state-note error-note">30件のうち2件にエラーがあります（架空の結果）。本番の取込は行っていません。</div>${simpleTable([['8','名称','必須項目がありません'],['21','日付','日付の形式を確認してください']],['行','項目','修正内容'])}<p class="help">実際の検証方式、部分取込の可否、再実行時の重複防止を業務仕様で定義します。</p></section></div></div>`+specs('SCR-IMPORT','取り込み前に形式・内容の問題を確認する','ファイル内容の読み取り・サーバー送信なし。検証結果表示のみデモ。','未選択、検証中、検証エラー、取込中、完了','検証段階でDBを変更しない。行と項目を特定してエラーを直せる。');}
function renderJobs(){return head('処理・出力状況','時間のかかる処理を一覧で追跡する',`<button data-demo="jobs-refresh">状態を更新</button>`)+`<div class="state-note">以下は状態表示の見本です。実行中の処理やバックグラウンド処理は存在しません。</div><section class="panel table-panel">${simpleTable([['JOB-003','データ出力',badge('完了'),'2026-10-29 10:30','<button data-demo="job-result">結果を見る</button>'],['JOB-002','データ取込',badge('実行中'),'2026-10-29 10:20','進捗率は取得できていません'],['JOB-001','データ取込',badge('失敗'),'2026-10-29 10:00','<button data-demo="job-error">失敗理由</button>']],['番号','処理','状態','開始日時（業務TZ）','操作・補足'])}</section>`+specs('SCR-JOBS','処理の状態と結果を追跡する','サンプル表示のみ。取消可否・再実行・結果期限は業務ごとに定義。','待機、実行、完了、失敗、取消','不明な進捗率を捏造せず、処理が存在するように誤認させない。');}
function renderSettings(){return head('表示設定','個人設定と全体設定の範囲を明確にする')+`<form id="settings-form" class="form-width"><section class="panel"><h2>この設計デモの表示</h2><div class="form-grid"><div><label for="density">情報密度</label><select id="density" name="density">${[['normal','標準：操作40px・行48px'],['compact','高密度：操作36px・行40px'],['touch','タッチ：操作44px・行56px']].map(([v,l])=>`<option value="${v}" ${document.body.dataset.density===v?'selected':''}>${l}</option>`).join('')}</select><p class="help">値は16pxを基準にした相当値です。文字の拡大を妨げません。</p></div><div><label for="setting-scope">適用範囲</label><input id="setting-scope" value="このHTMLを開いている間だけ" readonly></div></div></section><div class="action-bar"><span class="small muted">ブラウザー再読込で標準に戻ります。</span><button type="submit" class="primary">表示に適用</button></div></form><section class="panel"><h2>フォント・サイズの標準</h2>${simpleTable([['本文・入力値','1rem','16px'],['画面タイトル','1.5rem','24px'],['見出し','1.125rem','18px'],['ラベル・表・補足','.875rem','14px']],['用途','規定値','基本文字サイズ16pxの場合'])}<p class="help">CSSの共通トークンを使用しています。実際の書体は端末にインストールされた代替フォントにも依存します。</p></section>`+specs('SCR-SETTINGS','設定の適用範囲と反映時点を確認する','表示密度だけをメモリー上で変更。個人設定の保存や権限設定は実装しない。','通常、変更、適用、失敗','設定値の適用範囲を表示し、他の利用者へ影響するように見せない。');}
function renderHistory(){return head('変更履歴','操作主体・対象・日時・結果を照会する')+`<section class="panel"><p class="small muted" style="margin:0">対象：R-0001 ／ 日時表示：業務で定義するタイムゾーン ／ 以下は架空の履歴</p></section><section class="panel table-panel">${simpleTable([['2026-10-29 10:15','担当A','更新','R-0001',badge('完了'),'<button data-demo="history-diff">差分</button>'],['2026-10-28 15:20','担当B','承認','REQ-0008',badge('完了'),'<button data-demo="history-diff">内容</button>'],['2026-10-27 09:30','担当A','作成','R-0001',badge('完了'),'<button data-demo="history-diff">内容</button>']],['日時','操作主体','操作','対象','結果','参照'])}</section>`+specs('SCR-HISTORY','過去の操作と変更内容を照会する','参照のみ。履歴の更新・削除ボタンは設けない。サーバー監査ログ未接続。','通常、0件、取得失敗、閲覧権限なし','現在情報と過去情報を区別し、対象と時点を特定できる。');}
function renderPatterns(){return head('パターンカタログ','24の画面・領域パターンを組み合わせ、別プロジェクトへ展開する')+`<div class="state-note">このHTMLは12の代表ビューを用意しています。全24パターンの完成した画面ではありません。設計注記・状態切替は本番UIから分離してください。</div><section class="panel"><label for="pattern-filter">パターンを探す</label><input id="pattern-filter" placeholder="例：承認、予約、P04"></section><div class="pattern-grid">${PATTERNS.map(r=>`<section class="panel pattern-card" data-pattern-text="${esc(r.join(' '))}"><p class="code">${r[0]}</p><h2>${r[1]}</h2><p class="muted">${r[2]}</p><p><strong>構成：</strong>${r[3]}</p><details><summary>ルールと合格条件</summary><p style="margin-top:.75rem">${r[5]}</p><p><strong>状態：</strong>${r[6]}</p><p><strong>合格条件：</strong>${r[7]}</p></details></section>`).join('')}</div>`;}
const renderers={home:renderHome,list:renderList,detail:renderDetail,edit:renderEdit,master:renderMaster,approval:renderApproval,report:renderReport,import:renderImport,jobs:renderJobs,settings:renderSettings,history:renderHistory,patterns:renderPatterns};
function render(){const bits=(location.hash||'#/list').slice(2).split('?');route=views[bits[0]]?bits[0]:'list';params=new URLSearchParams(bits[1]||'');if(!['edit','master'].includes(route)){dirty=false;draft=null;}renderNavigation();document.getElementById('pattern-id').textContent=views[route][1];document.getElementById('view-picker').value=route;hideNotice();app.innerHTML=renderers[route]();document.title=views[route][0]+'｜業務Web HTML設計書';document.getElementById('site-menu').classList.remove('open');document.getElementById('menu-toggle').setAttribute('aria-expanded','false');}
document.getElementById('view-picker').innerHTML=Object.entries(views).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('');
document.getElementById('view-picker').onchange=e=>{let target='#/'+e.target.value;e.target.value=route;go(target);};
document.getElementById('menu-toggle').onclick=()=>{let open=document.getElementById('site-menu').classList.toggle('open');document.getElementById('menu-toggle').setAttribute('aria-expanded',String(open));};
document.addEventListener('click',e=>{let a=e.target.closest('a[href^="#/"]');if(a){e.preventDefault();go(a.getAttribute('href'));return;}let sort=e.target.closest('[data-sort]');if(sort){let key=sort.dataset.sort;location.hash=href('list',listParams({sort:key,dir:params.get('sort')===key&&params.get('dir')!=='desc'?'desc':'asc',page:1}));return;}let child=e.target.closest('[data-child]');if(child){selectedChild=Number(child.dataset.child);app.innerHTML=renderMaster();return;}let demo=e.target.closest('[data-demo]');if(demo){const messages={export:['出力範囲の設計','<p>本番では「検索結果全件」「現在ページ」「選択行」を明示して選択します。</p><p class="help">この設計デモではファイルを生成しません。大きな処理はジョブ画面で追跡します。</p>'],print:['印刷レイアウト','<p>操作画面とは別の印刷レイアウトを設計します。条件・基準時点・ページ番号等を定義してください。</p>'],'jobs-refresh':['更新の見本','<p>本番ではサーバーの最新状態を取得します。このHTMLでは通信を行いません。</p>'],'job-result':['結果の見本','<p>出力が完了した状態の表示例です。実ファイルやダウンロードURLはありません。</p>'],'job-error':['失敗理由の見本','<p>入力ファイルの項目定義が一致しませんでした（架空の例）。</p><p class="help">実際には修正対象と再実行条件を表示します。</p>'],'history-diff':['変更差分の見本','<p>担当：担当A → 担当B</p><p class="help">架空の履歴です。機密情報は権限に応じて表示を制限します。</p>']};let m=messages[demo.dataset.demo];showDialog(m[0],m[1],[{label:'閉じる'}]);return;}let b=e.target.closest('[data-action]');if(!b)return;switch(b.dataset.action){case'retry':demoState='normal';app.innerHTML=renderList();break;case'discard-edit':showDialog('変更を破棄しますか','<p>この対象の未保存の変更を破棄します。</p>',[{label:'編集を続ける'},{label:'変更を破棄',run:()=>{dirty=false;draft=null;render();}}]);break;case'add-child':childWorking.push({id:'D-'+String(Date.now()).slice(-5),name:'新しい明細',category:'分類A',memo:''});selectedChild=childWorking.length-1;dirty=true;app.innerHTML=renderMaster();break;case'delete-child':showDialog('明細を削除しますか',`<p>対象：${esc(childWorking[selectedChild].name)}</p><p class="help">全体保存まではデータベースへの確定を行わない設計です。</p>`,[{label:'キャンセル'},{label:'削除する',cls:'danger',run:()=>{childWorking.splice(selectedChild,1);dirty=true;app.innerHTML=renderMaster();}}]);break;case'discard-children':childWorking=structuredClone(children);dirty=false;app.innerHTML=renderMaster();break;case'save-children':if(saveCurrent())app.innerHTML=renderMaster();break;case'approve':case'return':{let back=b.dataset.action==='return',reason=document.getElementById('decision-reason').value.trim();if(back&&!reason){notify('差戻し理由を入力してください。');document.getElementById('decision-reason').focus();return;}showDialog(back?'差し戻しますか':'承認しますか','<p>対象：REQ-0008 ／ サンプル変更申請</p><p class="help">判断はこのデモ内の表示にだけ反映されます。</p>',[{label:'キャンセル'},{label:back?'差し戻す':'承認する',cls:'primary',run:()=>{approvalState=back?'差戻し済み':'承認済み';app.innerHTML=renderApproval();notify('デモ上の状態を変更しました。実際の申請処理は行っていません。');}}]);break;}case'validate-import':document.getElementById('import-result').hidden=false;break;case'report-filter':{let c=document.getElementById('report-class').value;let rows=data.filter(r=>!c||r.category===c);document.getElementById('report-table').innerHTML=reportTable(c);document.getElementById('report-total').innerHTML=rows.length+'<small>件</small>';document.getElementById('report-progress').innerHTML=rows.filter(r=>r.status==='進行中').length+'<small>件</small>';document.getElementById('report-done').innerHTML=rows.filter(r=>r.status==='完了').length+'<small>件</small>';notify('デモデータを集計しました。');break;}}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='search-form'){const f=new FormData(e.target);location.hash=href('list',{q:f.get('q'),category:f.get('category'),status:f.get('status'),page:1,size:params.get('size')||20});}else if(e.target.id==='edit-form'){saveCurrent();}else if(e.target.id==='settings-form'){document.body.dataset.density=document.getElementById('density').value;notify('このHTMLの表示密度を変更しました。再読込で標準に戻ります。');}});
document.addEventListener('input',e=>{if(e.target.closest('#edit-form')&&e.target.name){draft[e.target.name]=e.target.value;dirty=true;document.getElementById('dirty-state').textContent='未保存の変更があります';}if(e.target.closest('#child-form')&&e.target.name){childWorking[selectedChild][e.target.name]=e.target.value;dirty=true;document.getElementById('dirty-state').textContent='未保存の変更があります';}if(e.target.closest('#search-form'))document.getElementById('pending-filter').hidden=false;if(e.target.id==='pattern-filter'){let q=e.target.value.toLocaleLowerCase();document.querySelectorAll('.pattern-card').forEach(x=>x.hidden=!x.dataset.patternText.toLocaleLowerCase().includes(q));}});
document.addEventListener('change',e=>{if(e.target.id==='page-size')location.hash=href('list',listParams({page:1,size:e.target.value}));if(e.target.id==='demo-state'){demoState=e.target.value;app.innerHTML=renderList();document.querySelector('.spec').open=true;}if(e.target.id==='fail-save')failSave=e.target.checked;});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);document.querySelector('h1')?.focus({preventScroll:true});});
render();
</script></body></html>
