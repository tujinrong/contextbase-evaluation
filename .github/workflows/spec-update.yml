name: Direct main specification update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/spec-update.yml', '_spec_migration/payload.b64.4', '_spec_migration/review.py']
permissions:
  contents: write
concurrency:
  group: direct-main-spec-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Inspect inputs and apply validated specifications
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, base64, gzip, subprocess
          root=Path('_spec_migration')
          def blob(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          for p in sorted(root.glob('*')):
              if p.is_file(): print('INPUT',p,len(p.read_bytes()),blob(p.read_bytes()))
          if not (root/'payload.b64.4').exists():
              print('INPUTS_NOT_COMPLETE: snapshot only; no document writes')
              raise SystemExit(0)
          expected=['03b8cb1b4d678ac9fc125dbc44af24be9b54ebe6','59d2ef86c813537f170697394c866bbce2947416','9522bb5b51bfb999fd7a6b15dce5164b25932735','15c0772b438cf3c73b444193f372603f99693373']
          parts=[]
          for n,h in enumerate(expected,1):
              p=root/f'payload.b64.{n}'; b=p.read_bytes().strip()
              if n==2 and len(b)==9004 and blob(b)!=h:
                  candidates=[b[:i]+b[i+4:] for i in range(len(b)-3) if blob(b[:i]+b[i+4:])==h]
                  if candidates: b=candidates[0]
              assert blob(b)==h, f'Payload checksum mismatch in part {n}'
              parts.append(b)
          code=gzip.decompress(base64.b64decode(b''.join(parts),validate=True))
          target=root/'migrate.py'; target.write_bytes(code)
          print('MIGRATION_SHA256',hashlib.sha256(code).hexdigest())
          subprocess.run(['python3',str(target)],check=True)
          if (root/'review.py').exists(): subprocess.run(['python3',str(root/'review.py')],check=True)
          Path('/tmp/spec-update-complete').touch()
          PY
      - name: Commit documentation directly to main
        shell: bash
        run: |
          set -euo pipefail
          if test -f /tmp/spec-update-complete; then
            git fetch origin main
            test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
            git add -A -- spec docs
            if ! git diff --cached --quiet; then
              git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: align all specifications, Japanese birth dates and cross-document review'
              git push origin HEAD:refs/heads/main
            fi
            git rev-parse HEAD
          fi
      - name: Package current document and migration snapshot
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('snapshot.zip','w',ZIP_DEFLATED) as z:
              for root in ('spec','docs','_spec_migration'):
                  for p in sorted(Path(root).rglob('*')):
                      if p.is_file() and '__pycache__' not in p.parts:
                          z.write(p,str(p))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: spec-main-snapshot
          path: snapshot.zip
          retention-days: 1
