name: Reviewed specification v7 publication
on:
  push:
    branches: [main]
    paths: ['.github/workflows/spec-v7-publish.yml']
permissions:
  contents: write
concurrency:
  group: specification-v7-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare renderer
        run: |
          python -m pip install 'playwright==1.57.0' 'beautifulsoup4==4.14.3'
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m playwright install --with-deps chromium
      - name: Verify source, migrate, render and validate
        env:
          SOURCE_SHA256: 7516923218c2c29fc211525f432c59041cfd8050344bc3dedf65bfeba27b423e
        run: |
          set -euo pipefail
          git diff --exit-code 5e3398f3f6ac90fef66b61cc42109c540e9eba8c -- docs spec
          python - <<'PY'
          import base64,bz2,hashlib,os,pathlib,subprocess,sys,json
          parts=sorted(pathlib.Path('_spec_v7').glob('source.*.b64'))
          assert len(parts)==5, len(parts)
          data=bz2.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True))
          assert hashlib.sha256(data).hexdigest()==os.environ['SOURCE_SHA256'], 'source hash mismatch'
          script=pathlib.Path(os.environ['RUNNER_TEMP'])/'migrate_v7.py'
          script.write_bytes(data)
          subprocess.run([sys.executable,str(script),'.'],check=True)
          result=json.loads(pathlib.Path('validation-v7.json').read_text())
          assert result['status']=='PASS' and not result['errors'] and not result['postErrors'], result
          PY
      - name: Commit reviewed documents directly to main
        run: |
          set -euo pipefail
          mv validation-v7.json "$RUNNER_TEMP/validation-v7.json"
          rm -rf _spec_v7
          rm .github/workflows/spec-v7-publish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: isolate test-project1, expand evaluations and replace PostgreSQL with SQL Server'
          git push origin HEAD:main
      - name: Package published specification set
        run: |
          python - <<'PY'
          import pathlib,zipfile,hashlib,json,os,subprocess,shutil
          root=pathlib.Path('.')
          dest=pathlib.Path(os.environ['RUNNER_TEMP'])/'spec-v7-delivery'
          dest.mkdir(exist_ok=True)
          paths=sorted(p for prefix in ['docs','agents','test-project1'] for p in (root/prefix).rglob('*') if p.is_file())
          paths += [root/'README.md',root/'AGENTS.md']
          with zipfile.ZipFile(dest/'contextbase-spec-v7.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in paths:z.write(p,p.as_posix())
          publication={'publishedCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'files':{p.as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in paths}}
          (dest/'publication.json').write_text(json.dumps(publication,ensure_ascii=False,indent=2),encoding='utf-8')
          shutil.copy2(pathlib.Path(os.environ['RUNNER_TEMP'])/'validation-v7.json',dest/'validation-v7.json')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: spec-v7-delivery
          path: ${{ runner.temp }}/spec-v7-delivery/
          retention-days: 7
          if-no-files-found: error
