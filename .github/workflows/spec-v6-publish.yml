name: Reviewed specification v6 publication
on:
  push:
    branches: [main]
    paths: ['.github/workflows/spec-v6-publish.yml', '_spec_v6/bootstrap.py']
permissions:
  contents: write
concurrency:
  group: spec-v6-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare static HTML renderer
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify reviewed sources, render, validate and publish
        env:
          PYTHONUTF8: '1'
        run: python _spec_v6/bootstrap.py
      - name: Deliver published specifications and verification records
        uses: actions/upload-artifact@v4
        with:
          name: spec-v6-delivery
          path: ${{ runner.temp }}/spec-v6-delivery/
          if-no-files-found: error
          retention-days: 7
